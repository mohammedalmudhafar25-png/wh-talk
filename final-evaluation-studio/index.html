<style>
:root{--navy:#1E2A5A;--teal:#0FB5A6;--coral:#FF5A5F;--sun:#FFC23C;--violet:#7C5CFF;--A:#2B4C9B;--B:#0E9E91;--C:#E5484D;--D:#7C5CFF;
--ink:#1B2033;--ink2:#4A5168;--mute:#7D849A;--line:#E3E6EF;--bg:#F4F6FB;--card:#fff;--gold:#B8892B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.ar{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;direction:rtl;unicode-bidi:isolate}
body.noar .ar{display:none!important}
/* header */
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 14px;box-shadow:0 2px 10px rgba(30,42,90,.06)}
.brand{min-width:0}
.brand .t1{font-weight:800;color:var(--navy);font-size:17px;letter-spacing:.2px;white-space:nowrap}
.brand .t2{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
nav{display:flex;gap:4px;margin-left:auto;background:var(--bg);padding:4px;border-radius:14px}
nav button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--ink2)}
nav button.on{background:var(--navy);color:#fff}
.tools{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:6px}
.chip.off{opacity:.45}
.logo{height:52px;width:auto;display:block}
main{max-width:1180px;margin:0 auto;padding:18px 14px 120px}
h1,h2,h3{color:var(--navy);margin:.2em 0 .4em}
h2{font-size:22px}
.hint{color:var(--ink2);font-size:14px;margin:-4px 0 14px}
.hint .ar{display:block;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(30,42,90,.04)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink2)}
label.f input,label.f select,textarea{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-weight:500;color:var(--ink)}
textarea{width:100%;min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,181,166,.18)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn.teal{background:var(--teal)}.btn.coral{background:var(--coral)}.btn.sun{background:var(--sun);color:var(--ink)}.btn.violet{background:var(--violet)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
/* roster */
.st{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff}
.st .nm{font-weight:700}
.st .meta{font-size:13px;color:var(--mute)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--navy);flex:none}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;width:110px}
.prog i{display:block;height:100%;background:var(--teal);border-radius:4px}
.badge{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--bg);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
/* evaluate */
.secTabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.secTabs button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:8px}
.secTabs button.on{border-color:var(--navy);color:var(--navy);box-shadow:0 0 0 3px rgba(30,42,90,.08)}
.secTabs small{font-weight:600;color:var(--mute)}
.crit{border-left:6px solid var(--A);transition:box-shadow .2s}
.crit.act{box-shadow:0 0 0 3px rgba(15,181,166,.35)}
.crit .hd{display:flex;gap:10px;align-items:flex-start}
.num{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:14px}
.crit h3{margin:0;font-size:18px}
.crit .q{font-size:14px;color:var(--ink2);margin:6px 0 10px;padding:8px 10px;background:var(--bg);border-radius:10px}
details summary{cursor:pointer;color:var(--teal);font-weight:600;font-size:14px}
details ul{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--ink2)}
.scale{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:8px}
.scale button{min-height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:18px;color:var(--ink2);transition:transform .08s}
.scale button:active{transform:scale(.94)}
.scale button.sel{color:#fff;border-color:transparent;transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.15)}
.blab{font-size:13px;font-weight:700;margin-left:auto;white-space:nowrap}
.note{width:100%;margin-top:8px;border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.bandkey{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;margin:2px 0 10px}
.bandkey span{padding:3px 8px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:5px}
.scorebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--navy);color:#fff;padding:8px 12px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:center;font-size:14px}
.scorebar b{font-size:18px}
.scorebar .k{display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:60px}
.scorebar .k small{opacity:.75;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;color:var(--navy);min-width:70px}
.timer.over{color:var(--coral)}
.att{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.att input{width:110px;border:1.5px solid var(--line);border-radius:12px;padding:10px}
/* tooltip, toast */
.tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:6px 9px;border-radius:8px;opacity:0;transition:opacity .1s;max-width:260px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:100;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%)}
/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.tile small{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.tile .v{font-size:28px;font-weight:800;color:var(--navy);line-height:1.2}
.tile .s{font-size:13px;color:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.tbl th{color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.scroll{overflow-x:auto}
.hm td.c{width:34px;height:30px;font-weight:700;font-size:12px;border:2px solid #fff;border-radius:6px;padding:0}
/* report */
.rbar{position:sticky;top:69px;z-index:30;background:var(--bg);padding:8px 0}
.pwrap{overflow:hidden}
.pages{display:flex;flex-direction:column;align-items:center;gap:18px}
.page{width:210mm;height:297mm;flex:none;background:#fff;box-shadow:0 4px 24px rgba(30,42,90,.12);padding:10mm 13mm 8mm;display:flex;flex-direction:column;position:relative}
.ph{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.ph .pn{width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.ph .tt{flex:1;text-align:center}
.ph .tt span{background:linear-gradient(transparent 55%,rgba(255,194,60,.55) 55%);font-weight:800;color:var(--navy);letter-spacing:.5px;font-size:14px;text-transform:uppercase;padding:0 4px}
.ph img{height:15mm;width:auto}
.pf{margin-top:auto;border-top:1.5px solid #B9BDC8;padding-top:5px;text-align:center;font-family:Stencil,"Stencil Std","Arial Black",Impact,sans-serif;letter-spacing:3px;font-size:11px}
.pf .n{color:#8A8F9C}.pf .m{color:var(--gold)}
.pbody{flex:1;min-height:0;overflow:hidden;font-size:12.5px}
.pbody.tight{font-size:11.6px}.pbody.tight h3{margin:6px 0 4px}.pbody.tight .box{padding:6px 9px;margin-bottom:6px}.pbody.tight .rem{padding:4px 8px}.pbody.tight .cred{font-size:10px}
.pbody h3{font-size:15px;margin:10px 0 6px;display:flex;align-items:center;gap:8px}
.pbody h3 .ar{font-size:13px;color:var(--mute);font-weight:600}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:stretch}
.idbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.idbox div{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line)}
.idbox div:last-child{border:0}
.idbox b{color:var(--navy)}
.big{border-radius:14px;padding:12px;color:#fff;background:var(--navy);display:flex;flex-direction:column;justify-content:center;gap:4px}
.big .sc{font-size:38px;font-weight:900;line-height:1}
.big .sc small{font-size:16px;opacity:.8;font-weight:700}
.big .lb{font-weight:700}
.big .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.big .pill{background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.bars .b{display:grid;grid-template-columns:150px 1fr 36px;align-items:center;gap:6px;margin:5px 0}
.bars .tr{height:12px;background:#EEF0F5;border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;border-radius:0 4px 4px 0}
.bars .v{font-weight:800;text-align:right}
.ptbl{width:100%;border-collapse:collapse}
.ptbl{font-size:11.5px}.ptbl td{padding:1.6px 4px;border-bottom:1px solid #EEF0F5;vertical-align:middle}
.ptbl .tr{height:9px;background:#EEF0F5;border-radius:4px;overflow:hidden;width:100%}
.ptbl .tr i{display:block;height:100%;border-radius:0 4px 4px 0}
.ptbl .bl{font-size:11px;font-weight:700;white-space:nowrap}
.box{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;break-inside:avoid}
.box.str{border-left:5px solid var(--B)}
.box.pri{border-left:5px solid var(--coral)}
.box h4{margin:0 0 3px;font-size:13.5px;color:var(--navy);display:flex;gap:8px;align-items:center}
.box h4 .s{margin-left:auto;font-size:12px}
.box ul{margin:3px 0 0;padding-left:18px}
.box li{margin:1px 0}
.box .ar{color:var(--ink2);font-size:12.5px;margin-top:3px}
.tier{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--coral)}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wk{border-radius:12px;padding:7px;background:var(--bg);font-size:11.5px}
.wk b{display:block;color:var(--navy);margin-bottom:3px}
.road{display:flex;align-items:center;gap:8px;margin:4px 0 8px;flex-wrap:wrap}
.lv{padding:6px 12px;border-radius:10px;font-weight:800;border:2px solid var(--line);color:var(--mute)}
.lv.now{background:var(--navy);color:#fff;border-color:var(--navy)}
.lv.nx{border-color:var(--teal);color:var(--B)}
.path{display:flex;gap:8px;padding:3px 0;font-size:11.8px;border-bottom:1px dashed var(--line)}
.path .tag{font-size:10.5px;font-weight:800;color:#fff;background:var(--teal);border-radius:6px;padding:1px 6px;white-space:nowrap;height:fit-content}
.rem{border:1px solid var(--line);border-radius:10px;padding:5px 9px;margin-bottom:5px;font-size:12px;white-space:pre-wrap;min-height:30px}
.rem b{color:var(--navy);display:block;font-size:12px}
.cred{font-size:10.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.sig{display:flex;justify-content:space-between;margin-top:10px;font-size:12px}
.legend{display:flex;gap:12px;justify-content:center;font-size:11.5px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.empty{text-align:center;padding:40px 16px;color:var(--ink2)}
.aibox{margin-top:8px;padding:8px 10px;border-radius:10px;background:#F4F1FF;border:1px solid #DCD3FF;font-size:14px}
.aibox b{color:#5B3FD6}
.aibox.au{background:#EAF8F6;border-color:#BFE9E3}.aibox.au b{color:#0B7F75}
.src{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#EDE8FF;color:#5B3FD6;white-space:nowrap}
.src.t{background:#E3F6F3;color:#0B7F75}.src.u{background:#FFF1D6;color:#8A5A00}
.stat{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:800}
.stat.dr{background:#FFF1D6;color:#8A5A00}.stat.ap{background:#E3F6F3;color:#0B7F75}.stat.ip{background:#EEF0F5;color:var(--ink2)}
.draft{background:repeating-linear-gradient(45deg,#FFF6DE,#FFF6DE 10px,#FFEDC0 10px,#FFEDC0 20px);border:1.5px solid #E0A800;border-radius:10px;padding:4px 10px;font-weight:800;color:#7A5A00;text-align:center;margin-bottom:8px;font-size:11.5px}
.lab{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:4px}
.lab th{background:var(--navy);color:#fff;text-align:left;padding:4px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
.lab td{padding:4px 6px;border-bottom:1px solid #EEF0F5;vertical-align:top}
.lab .bad{color:#B42318}.lab .good{color:#0B7F75;font-weight:700}.lab .ty{font-size:10px;font-weight:800;color:var(--mute);text-transform:uppercase}
.mtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px;margin-bottom:6px}
.mt{background:var(--bg);border-radius:10px;padding:6px 8px}.mt b{font-size:17px;color:var(--navy);display:block;line-height:1.2}.mt small{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.edl{width:100%;border-collapse:collapse;font-size:14px}.edl td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.edl input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px}
#dock{position:sticky;top:69px;z-index:25;max-width:1180px;margin:0 auto;padding:8px 14px 0;display:none}
#dock.on{display:block}
#dock .in{background:#0F1630;border-radius:14px;padding:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#dock video,#dock audio{flex:1;min-width:240px;max-height:30vh;border-radius:10px;background:#000}
#dock .nm{color:#fff;font-size:13px;font-weight:700}
#dock.min video{display:none}
.trans{max-height:260px;overflow:auto;background:var(--bg);border-radius:10px;padding:10px;font-size:14px;white-space:pre-wrap}
.bt{display:inline-flex;align-items:center;gap:5px;font-weight:700;white-space:nowrap;color:var(--ink)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button:disabled,input:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}
.scale button:disabled:not(.sel){opacity:.35}.scale button.sel:disabled{opacity:1}
.dtag{font-size:10px;font-weight:800;background:#FFEDC0;color:#7A5A00;border:1px solid #E0A800;border-radius:6px;padding:1px 6px;letter-spacing:.5px}
.chk{list-style:none;margin:0 0 10px;padding:0;font-size:14px}.chk li{padding:2px 0}.chk .ok{color:#0B7F75}.chk .no{color:#8A5A00;font-weight:600}
.help ol{margin:8px 0;padding-left:20px}.help li{margin:3px 0}
.anch{font-size:13.5px;color:var(--ink2);margin-top:6px;padding:6px 8px;background:#FFF9E8;border-radius:8px}
.ponly{display:none}
.appf{text-align:center;margin-top:20px;font-family:Stencil,"Stencil Std","Arial Black",Impact,sans-serif;letter-spacing:3px;font-size:11px}
.appf small{display:block;font-family:"Segoe UI",system-ui,sans-serif;letter-spacing:0;color:var(--mute);margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:760px){
 .top{flex-wrap:wrap;padding:8px 10px}
 nav{order:3;width:100%;margin:0;justify-content:space-between}
 nav button{flex:1;padding:8px 4px;font-size:14px}
 .tools{margin-left:auto}
 .logo{height:42px}
 .brand .t2{max-width:150px}
 .scale{gap:4px}.scale button{min-height:44px;font-size:16px;border-radius:10px}
 .rbar{position:static}
 #dock{top:118px;padding:6px 10px 0}
 .card .mtiles{grid-template-columns:repeat(3,1fr)}
 .scorebar{gap:6px 10px;padding:6px 8px}.scorebar .k{min-width:46px}.scorebar .k.x{display:none}.scorebar b{font-size:16px}
 .st{flex-wrap:wrap}
}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}
 .top,.rbar,.scorebar,.tip,.toast,.noprint{display:none!important}
 main{padding:0;max-width:none}
 .pages{gap:0;display:block}
 #dock{display:none!important}
 .ponly{display:flex!important}
 body:not([data-view="report"]) main{padding:12mm}
 body:not([data-view="report"]) .tbl{font-size:11px}
 body:not([data-view="report"]) .tbl th{font-size:9.5px}
 .stat,.badge{font-size:10.5px!important;padding:2px 7px!important}
 body:not([data-view="report"]) .btn,body:not([data-view="report"]) .secTabs{display:none!important}
 .pages{transform:none!important;width:auto!important}
 .pwrap{height:auto!important;overflow:visible!important}
 .page{box-shadow:none;width:210mm;height:296.5mm;overflow:hidden;page-break-after:always;break-after:page;max-width:none}
 .lab tr,.box,.mt{break-inside:avoid}
 .page:last-child{page-break-after:auto;break-after:auto}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body.printdash .card{break-inside:avoid}
}
</style>

<script>
"use strict";
/* ============ CONTENT (from Mohammed's Level 5 & Level 6 assessment tables) ============ */
const SEC={A:{en:"Language Use",ar:"استخدام اللغة",col:"#2B4C9B"},B:{en:"Presentation Skills",ar:"مهارات العرض",col:"#0E9E91"},C:{en:"Overall Performance",ar:"الأداء العام",col:"#E5484D"},D:{en:"Course Record",ar:"سجل الدورة",col:"#7C5CFF"}};
const C=[
{id:"c1",sec:"A",en:"Fluency & Coherence",s:"Fluency",ar:"الطلاقة والترابط",
 b:["Speaks at length without unnatural pauses.","Logical and clear organisation of ideas.","Effective use of linking words and discourse markers (so, however, because, in contrast).","Natural self-correction; hesitation that does not impede communication is acceptable."],
 q:"Can the speaker maintain a clear, logical flow of speech without disruptive pauses or loss of direction?",
 p:"speaks at length with a clear, logical flow",n:"reduce long pauses and link ideas with discourse markers",
 d:["Daily 2-minute talk: record yourself on a familiar topic using PACE (Point, Add, Connect, Expand), then count your long pauses and beat that number tomorrow.","Learn 6 linkers by heart (however, so, because of this, on the other hand, for example, in short) and use at least 2 in every answer.","Word-generation first: jot 8–10 related words (place, time, people, likes, ways), then speak from them without stopping."],
 t:"لا تتوقف لتبحث عن كلمة صعبة؛ استخدم كلمة أبسط وأكمل الفكرة."},
{id:"c2",sec:"A",en:"Lexical Resource (Vocabulary)",s:"Vocabulary",ar:"الحصيلة اللغوية (المفردات)",
 b:["Range and precision of vocabulary, including less common and idiomatic expressions.","Paraphrases effectively and avoids unnecessary repetition.","Word choice shows flexibility, accuracy and contextual appropriateness."],
 q:"Does the speaker employ varied, precise, and contextually suitable vocabulary throughout?",
 p:"uses varied and precise vocabulary",n:"widen vocabulary and paraphrase instead of repeating",
 d:["Keep a collocation notebook: 5 new word partners a day (make a decision, heavy traffic) with one example sentence each.","Paraphrase drill: say the same idea 3 ways (It's very important / It's essential / It plays a key role).","Upgrade overused words: swap good, bad, very for precise ones (helpful, harmful, extremely)."],
 t:"تعلّم الكلمة مع الكلمات التي ترافقها عادةً، وليس كلمة منفردة."},
{id:"c3",sec:"A",en:"Grammatical Range & Accuracy",s:"Grammar",ar:"تنوع القواعد ودقتها",
 b:["Uses a variety of sentence structures: simple, compound and complex.","Accuracy in tense consistency, subject-verb agreement, articles and clause construction.","Frequency and impact of errors on overall comprehension."],
 q:"Can the speaker deploy a range of grammatical structures correctly and with natural ease?",
 p:"controls a good range of grammar structures",n:"use more complex sentences with fewer errors",
 d:["Error log: write down your 3 most frequent mistakes from feedback and say 5 correct sentences for each.","Complex-sentence builder: join two ideas with because, although, which or if — 5 sentences a day.","Tense check: tell a past story, then the same plan in the future; record it and check every verb form."],
 t:"ابدأ بأخطائك المتكررة؛ تصحيح ثلاثة أخطاء فقط يغيّر كلامك كله."},
{id:"c4",sec:"A",en:"Pronunciation",s:"Pronunciation",ar:"النطق",
 b:["Clarity and intelligibility of speech at all times.","Appropriate stress, rhythm and intonation to convey meaning.","Accent, however present, does not hinder understanding.","Connected speech features (linking, elision) add naturalness."],
 q:"Is the speaker's pronunciation consistently clear, natural, and easy to follow?",
 p:"is clear, natural and easy to understand",n:"work on word stress, rhythm and clear sounds",
 d:["Shadowing: 5 minutes a day repeating a short native clip at the same speed and melody.","Stress map: mark the stressed syllable in 10 key words of your topic (PREsent / preSENT) and say them aloud.","Linking practice: say phrases like turn it off, pick it up as one smooth flow; record and compare."],
 t:"قلّد الإيقاع والنغمة كاملة، وليس الأصوات المفردة فقط."},
{id:"c5",sec:"A",en:"Mediation",s:"Mediation",ar:"الوساطة وتبسيط الأفكار",
 b:["Explains or simplifies complex ideas for varied audiences.","Rephrases information in accessible terms when needed.","Summarises or paraphrases spoken or written content accurately.","Adapts register and complexity to the listener's needs."],
 q:"Can the speaker clearly simplify, rephrase, or relay ideas in a way that aids others' understanding?",
 p:"explains and simplifies ideas well for others",n:"rephrase and simplify ideas for the listener",
 d:["Explain-it-simply: take one paragraph from an article and explain it to a beginner in 3 short sentences.","Summarise a 2-minute video in 30 seconds: The main idea is… / This means…","Practise check-and-clarify phrases: In other words…, Put simply…, Does that make sense?"],
 t:"إذا لم يفهمك المستمع، أعد الفكرة بكلمات أبسط ومثال من حياته."},
{id:"c6",sec:"B",en:"Eye Contact",s:"Eye contact",ar:"التواصل البصري",
 b:["Maintains consistent and meaningful eye contact with the audience.","Avoids reading directly from notes or slides.","Engages different members of the audience throughout."],
 q:"Does the speaker connect visually with the audience rather than relying on written materials?",
 p:"connects with the audience through eye contact",n:"look at the audience more and rely less on notes",
 d:["Use keyword cards instead of full sentences so your eyes stay on the audience.","Three-zone scan: left, centre, right — hold each look for one complete idea.","Rehearse for a friend who raises a hand every time you look down for too long."],
 t:"انظر إلى الجمهور لا إلى الورقة؛ الكلمات المفتاحية تكفيك."},
{id:"c7",sec:"B",en:"Body Language",s:"Body language",ar:"لغة الجسد",
 b:["Purposeful gestures, open posture and appropriate facial expressions.","Avoids distracting mannerisms.","Physical presence shows confidence and command of the space."],
 q:"Does the speaker's non-verbal communication support and enhance the spoken message?",
 p:"uses confident, purposeful body language",n:"use open posture and purposeful gestures",
 d:["Film a rehearsal and watch it with the sound off; find one distracting habit and remove it.","Plan 3 purposeful gestures: counting your points, showing size, showing contrast.","Start and finish with a still, open posture and a natural smile."],
 t:"جسدك يتكلم أيضاً: وقفة ثابتة، يدان مفتوحتان، وابتسامة طبيعية."},
{id:"c8",sec:"B",en:"Voice Quality & Projection",s:"Voice",ar:"جودة الصوت ووضوحه",
 b:["Appropriate volume for the setting.","Varies tone, pitch and pace to keep interest and stress key points.","Avoids monotone; uses deliberate pauses for effect."],
 q:"Is the speaker's voice clear, dynamic, and well-modulated throughout?",
 p:"has a clear, well-projected and varied voice",n:"project the voice and vary tone and pace",
 d:["Mark your script: underline words to stress and add / where you will pause.","Read one paragraph three ways — slow, normal, energetic — and choose what fits the message.","Speak to the back of the room: breathe from the chest, not the throat."],
 t:"غيّر سرعة صوتك ونبرته، واستخدم الوقفات لتجذب الانتباه."},
{id:"c9",sec:"B",en:"Use of Visual Aids",s:"Visual aids",ar:"استخدام الوسائل البصرية",
 b:["Slides, charts and diagrams are clear, relevant and well designed.","Refers to and explains visuals without over-relying on them.","Visuals enhance rather than replace spoken content."],
 q:"Are visual aids used purposefully and do they strengthen the overall presentation?",
 p:"uses visual aids purposefully",n:"make slides clearer and explain them instead of reading them",
 d:["Apply the 6×6 rule: at most 6 lines of 6 words, one idea per slide.","Replace paragraphs with an image, a chart or 3 keywords.","Introduce every visual: As you can see here… This shows that…"],
 t:"الشريحة تدعم كلامك ولا تتكلم بدلاً عنك."},
{id:"c10",sec:"B",en:"Audience Engagement",s:"Engagement",ar:"جذب الجمهور",
 b:["Captures attention from the outset and sustains it.","Uses rhetorical questions, examples, humour or interaction.","Responds to audience reactions appropriately."],
 q:"Does the speaker actively involve and maintain the interest of the audience?",
 p:"engages and involves the audience",n:"involve the audience with questions and real examples",
 d:["Open with a hook: a question, a surprising fact or a 20-second story.","Add one interaction every 2 minutes: a question, a show of hands, a quick guess.","Talk to the audience with you and examples from their real life."],
 t:"ابدأ بسؤال أو قصة قصيرة، وأشرك الجمهور كل دقيقتين."},
{id:"c11",sec:"B",en:"Structure & Organisation",s:"Structure",ar:"البناء والتنظيم",
 b:["Purposeful introduction, well-developed body and strong conclusion.","Smooth, signposted transitions between sections.","The overall narrative is easy to follow."],
 q:"Is the presentation coherently organised with a clear beginning, middle, and end?",
 p:"organises the talk with a clear beginning, middle and end",n:"signpost a clear introduction, body and conclusion",
 d:["Plan every main point with SREF: Statement, Reason, Example, Feeling (or STAR for experiences).","Signpost out loud: First…, Moving on to…, To sum up…","Write your conclusion first, then build the body to lead to it."],
 t:"مقدمة واضحة، ثلاث نقاط رئيسية، وخاتمة قوية."},
{id:"c12",sec:"B",en:"Timing & Pacing",s:"Timing",ar:"إدارة الوقت والإيقاع",
 b:["Manages allotted time, covering all key points without rushing or running short.","Pacing lets the audience absorb information.","Shows awareness of time and adjusts delivery."],
 q:"Does the speaker use time efficiently and maintain an appropriate pace throughout?",
 p:"manages time and pace well",n:"rehearse with a timer to fit the allotted time",
 d:["Rehearse twice with a timer; cut or add one example to hit the target time.","Write time checkpoints in your notes (1 min, 3 min, 5 min).","Prepare one optional extra example and one part you can skip if time is short."],
 t:"تدرّب مع مؤقّت؛ الالتزام بالوقت جزء من التقييم."},
{id:"c13",sec:"C",en:"Confidence & Delivery",s:"Confidence",ar:"الثقة وأسلوب الإلقاء",
 b:["Well-prepared, composed and enthusiastic about the topic.","Delivers content with assurance and authority.","Handles unexpected moments or questions calmly and professionally."],
 q:"Does the speaker project confidence and genuine engagement with the material?",
 p:"presents with confidence and composure",n:"prepare more fully to speak with calm confidence",
 d:["Rehearse aloud 3 full times — confidence comes from preparation.","Memorise your first 3 sentences and your final sentence.","Before you start: breathe in for 4 seconds, out for 4, and say the first sentence slowly."],
 t:"التحضير الجيد يصنع الثقة؛ احفظ البداية والنهاية جيداً."},
{id:"c14",sec:"C",en:"Content Knowledge & Depth",s:"Content",ar:"المعرفة بالمحتوى وعمقه",
 b:["Understands the subject beyond surface-level recall.","Elaborates, gives examples and makes relevant connections.","Content is accurate, meaningful and detailed for the level."],
 q:"Does the speaker show genuine understanding and command of the topic?",
 p:"shows solid knowledge of the topic",n:"deepen topic knowledge with examples and facts",
 d:["Read 2 extra sources on your topic and add one fact or statistic.","For every point prepare one real example and one sentence on why it matters.","Teach the topic to a friend in 2 minutes; note anything you could not explain."],
 t:"افهم الفكرة بعمق حتى تشرحها بكلماتك وأمثلتك."},
{id:"c15",sec:"C",en:"Interaction & Responsiveness",s:"Interaction",ar:"التفاعل والاستجابة",
 b:["Responds to questions and feedback with clarity and relevance.","Involves the audience actively where appropriate.","Listens attentively and adapts responses thoughtfully."],
 q:"Can the speaker interact naturally and respond effectively to questions or engagement?",
 p:"responds to questions clearly and thoughtfully",n:"listen carefully and give clear, relevant answers",

async function analyseAudio(s,g){const m=media[s.id];if(!m)return toast("Load a recording first");if(m.file.size>450e6)return toast("This file is too large to analyse in the browser (over 450 MB). Use an audio-only or smaller copy for the audio check.");toast("Analysing audio… (large videos can take a minute)");await new Promise(r=>setTimeout(r,60));

 <tr><td><b>Class avg</b></td>${cav.map(x=>`<td class="c" style="background:${seqCol(x.v)};color:${x.v>=6?"#fff":"#1B2033"}" data-tip="Class average · ${x.c.en}: ${f1(x.v)}">${x.v!=null?f1(x.v):""}</td>`).join("")}</tr></tbody></table>
 <div class="legend" style="justify-content:flex-start;margin-top:8px">${["A","B","C"].map(k=>`<span><span class="dot" style="background:${SEC[k].col}"></span>${k} ${SEC[k].en} (${k==="A"?"1–5":k==="B"?"6–12":"13–15"})</span>`).join("")}</div></div>`;
 h+=`<div class="grid g2"><div class="card"><h3>Class average by criterion</h3><div class="bars">${cav.map((x,i)=>`<div class="b" data-tip="${x.c.en}: ${f1(x.v)} (${x.n} rated)"><span style="font-size:13px">${i+1} ${x.c.s}</span><span class="tr"><i style="width:${(x.v||0)/9*100}%;background:${SEC[x.c.sec].col}"></i></span><span class="v">${f1(x.v)}</span></div>`).join("")}</div></div>
 <div class="card"><h3>Band distribution</h3><div class="bars">${bc.map(x=>`<div class="b" data-tip="${x.b.en}: ${x.n} student(s)"><span style="font-size:13px">${x.b.en}</span><span class="tr"><i style="width:${done.length?x.n/done.length*100:0}%;background:${x.b.col}"></i></span><span class="v">${x.n}</span></div>`).join("")}</div>
 <h3 style="margin-top:18px">Focus for the next course</h3>${low.map(x=>`<div class="box pri"><h4>${x.c.en}<span class="s">${f1(x.v)} avg</span></h4>Class activity: ${x.c.d[1]}</div>`).join("")}
 <h3 style="margin-top:14px">Class strengths to build on</h3>${top.map(x=>`<div class="box str"><h4>${x.c.en}<span class="s">${f1(x.v)} avg</span></h4></div>`).join("")}</div></div>`;
 h+=classErrors(g);app.innerHTML=h;
 app.querySelectorAll("th[data-k]").forEach(t=>t.onclick=()=>{const k=t.dataset.k;sortD=sortK===k?-sortD:(k==="name"?1:-1);sortK=k;render()});
 app.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>{curStu=b.dataset.rp;go("report")});
 $("#aiD").onclick=()=>$("#aiIn").click();
 $("#pa").onclick=()=>printAll(g);
 $("#pd").onclick=()=>{document.body.classList.add("printdash");window.print();setTimeout(()=>document.body.classList.remove("printdash"),500)};
 $("#csv").onclick=()=>{const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const head=["Student","Topic","Time",...C.map((c,i)=>`${i+1} ${c.s}`),"A Language","B Presentation","C Overall","Total /27","Score /9","Band","CEFR (est.)",...REC.map(x=>x.en),"Course record %","Final %","Status","Approved on","Unconfirmed AI/auto scores","Errors noted","Strengths","Development","Next steps",...C.map((c,i)=>`Note ${i+1} ${c.s}`)];
  const lines=[head.map(q).join(",")].concat(g.students.map(s=>{const r=calc(s,g),b=band(r.ov);return[s.name,s.topic,s.time,...C.map(c=>s.scores[c.id]),f1(r.A),f1(r.B),f1(r.C),f1(r.t27),f1(r.ov),b?b.en:"",r.cefr,...REC.map(x=>s.rec[x.id]),r.rec!=null?Math.round(r.rec):"",r.fin!=null?Math.round(r.fin):"",s.status==="approved"?"Approved":"Draft",s.approvedAt||"",pendingCount(s),s.lab.errors.length,s.rem.str,s.rem.dev,s.rem.next,...C.map(c=>s.notes[c.id]||"")].map(q).join(",")}));
  download(`${g.name.replace(/[^\w\- ]+/g,"")}_final_evaluation.csv`,"﻿"+lines.join("\r\n"),"text/csv;charset=utf-8");toast("CSV downloaded")}}

function classErrors(g){const m={};let tot=0;g.students.forEach(s=>{const seen=new Set();s.lab.errors.forEach(e=>{let k=String(e.type||"Other").trim().toLowerCase();k=k?k[0].toUpperCase()+k.slice(1):"Other";m[k]=m[k]||{n:0,st:0,ex:e};m[k].n++;tot++;if(!seen.has(k)){seen.add(k);m[k].st++}})});
 const L=Object.entries(m).sort((a,b)=>b[1].n-a[1].n).slice(0,8);if(!L.length)return"";const mx=L[0][1].n;
 return `<div class="card"><h3>Most common language errors in this class</h3><p class="hint" style="margin:0 0 8px">${tot} correction(s) recorded in the Language Lab. Teach the top types first.</p><div class="bars">${L.map(([k,v])=>`<div class="b" data-tip="${esc(k)}: ${v.n} error(s) from ${v.st} student(s)"><span style="font-size:13px">${esc(k)}</span><span class="tr"><i style="width:${v.n/mx*100}%;background:#C77700"></i></span><span class="v">${v.n}</span></div>`).join("")}</div>
 <div style="font-size:13.5px;color:var(--ink2);margin-top:8px">${L.slice(0,3).map(([k,v])=>`<div style="margin:2px 0"><b>${esc(k)}</b> (${v.st} student${v.st>1?"s":""}), for example: <span style="color:#B42318">${esc(v.ex.said)}</span> → <span style="color:#0B7F75;font-weight:700">${esc(v.ex.better)}</span></div>`).join("")}</div></div>`}
function printAll(g){const list=g.students.filter(s=>calc(s,g).ov!=null);if(!list.length)return toast("No evaluated students yet");
 const dr=list.filter(s=>s.status!=="approved").length;if(dr&&!confirm(`${dr} report(s) are still drafts and will print with a DRAFT banner. Continue?`))return;
 stopSpeak();document.body.dataset.view="report";document.title=`${g.name} – Final Evaluation Reports`;app.innerHTML=`<div class="pwrap"><div class="pages">${list.map(s=>`<div class="rep">${reportPages(s,g,calc(s,g))}</div>`).join("")}</div></div>`;fitPages();$(".scorebar")&&$(".scorebar").remove();
 const back=()=>{window.removeEventListener("afterprint",back);render()};window.addEventListener("afterprint",back);setTimeout(()=>window.print(),150)}
/* ============ START ============ */
if(!G()&&S.groups[0])S.cur=S.groups[0].id;
go(G()&&G().students.length?"class":"class");
</script>

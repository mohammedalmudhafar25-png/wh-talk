<style>:root{--navy:#1E2A5A;--teal:#0FB5A6;--coral:#FF5A5F;--sun:#FFC23C;--violet:#7C5CFF;--sky:#3B9DFF;--green:#16A34A;--green2:#DCFCE7;--red:#E11D48;--red2:#FFE4E6;--ink:#1F2937;--muted:#6B7280;--card:#FFFFFF;--bg:#FFF8EC;--line:#E9E2D3;--r:18px;--sh:0 6px 18px rgba(30,42,90,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 1px 1px,rgba(30,42,90,.07) 1px,transparent 0);background-size:22px 22px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;color:inherit;background:none}
.ar{font-family:"Segoe UI","Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif;direction:rtl;color:#475569}
body.noar .ar{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:3px solid var(--sun);min-height:64px}
.top .home{width:42px;height:42px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.top .home svg{width:22px;height:22px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:16px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .logo{height:56px;width:auto;flex:none;margin-left:auto}
.gear{width:42px;height:42px;border-radius:12px;background:#F1F5F9;display:grid;place-items:center;flex:none}
.gear svg{width:22px;height:22px}
main{max-width:980px;margin:0 auto;padding:14px 14px 120px}
/* settings */
.setbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:6px 0 16px}
.seg{display:inline-flex;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--sh)}
.seg button{padding:7px 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--navy);color:#fff}
.seg .lbl{padding:0 6px 0 10px;font-size:12px;font-weight:800;color:var(--muted);align-self:center;text-transform:uppercase;letter-spacing:.06em}
/* hub */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(120deg,#1E2A5A,#2E3F8F 60%,#0FB5A6);color:#fff;border-radius:24px;padding:18px 20px;box-shadow:var(--sh);overflow:hidden;position:relative}
.hero h1{margin:0;font-size:26px;letter-spacing:-.01em}
.hero p{margin:4px 0 0;opacity:.9;font-size:14px}
.hero .ar{color:#E0F2FE}
.hero svg.compass{width:84px;height:84px;flex:none}
.sec{margin:20px 4px 8px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);text-align:left;display:flex;gap:12px;align-items:center;border:2px solid transparent;transition:transform .15s,border-color .15s}
.gcard:hover{transform:translateY(-2px);border-color:var(--sun)}
.gcard .ic{width:62px;height:62px;flex:none;border-radius:16px;display:grid;place-items:center}
.gcard .ic svg{width:46px;height:46px}
.gcard b{display:block;font-size:16px;color:var(--navy)}
.gcard small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.stars{color:var(--sun);font-size:15px;letter-spacing:1px;margin-top:4px}
.stars i{font-style:normal;color:#E5E7EB}
.foot{margin-top:26px;border-top:2px solid #D1D5DB;padding-top:8px;text-align:center;font-family:Stencil,"Arial Black",Impact,sans-serif;letter-spacing:.22em;font-size:11.5px}
.foot .n{color:#6B7280}.foot .c{color:#1D4ED8}.foot .m{color:#B8860B}
/* intro / modes */
.intro{background:#fff;border-radius:24px;padding:18px;box-shadow:var(--sh);text-align:center}
.intro .big{width:96px;height:96px;margin:0 auto 6px;border-radius:24px;display:grid;place-items:center}
.intro .big svg{width:70px;height:70px}
.intro h2{margin:4px 0;color:var(--navy);font-size:24px}
.intro p{margin:2px 0;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.mode{background:#F8FAFC;border:2px solid var(--line);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.15s}
.mode:hover{border-color:var(--teal);background:#F0FDFA;transform:translateY(-2px)}
.mode .mi{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff}
.mode .mi svg{width:28px;height:28px}
.mode b{color:var(--navy);font-size:16px}
.mode small{color:var(--muted);font-size:12px}
/* play area */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog{flex:1;height:12px;background:#E5E7EB;border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--sky));border-radius:999px;transition:width .35s}
.score{font-weight:800;color:var(--navy);background:#fff;border-radius:999px;padding:5px 12px;box-shadow:var(--sh);font-size:14px;white-space:nowrap}
.score .ok{color:var(--green)}
.stage{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:16px;text-align:center;position:relative}
.ask{font-size:15px;color:var(--muted);margin:0 0 10px;font-weight:600}
.ask .ar{display:block;font-size:14px}
.scene{width:100%;max-width:420px;margin:0 auto;display:block}
.scene svg{width:100%;height:auto;display:block}
.say{font-size:13px;color:var(--violet);font-weight:700}
.play{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:999px;padding:12px 22px;font-weight:800;font-size:17px;box-shadow:0 6px 0 #10183A;transition:transform .08s}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #10183A}
.play svg{width:24px;height:24px}
.play.big{padding:22px 34px;font-size:20px}
.play.sm{padding:8px 14px;font-size:14px;box-shadow:0 4px 0 #10183A}
.play.teal{background:var(--teal);box-shadow:0 6px 0 #0B7F75}
.play.coral{background:var(--coral);box-shadow:0 6px 0 #B9383C}
.play.violet{background:var(--violet);box-shadow:0 6px 0 #5537C4}
.play.ghost{background:#EEF2FF;color:var(--navy);box-shadow:0 4px 0 #C7D2FE}
.play.playing{animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}
.opts{display:grid;gap:10px;margin-top:14px;grid-template-columns:repeat(2,1fr)}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.pics{max-width:700px;margin-left:auto;margin-right:auto}
.opt{background:#F8FAFC;border:3px solid var(--line);border-radius:16px;padding:12px 8px;font-weight:800;font-size:19px;color:var(--navy);min-height:60px;transition:transform .1s,border-color .15s,background .15s;position:relative}
.opt:hover{border-color:#94A3B8}
.opt.pic{padding:6px}
.opt.pic svg{width:100%;height:auto;display:block}
.opt.good{border-color:var(--green);background:var(--green2);animation:pop .35s}
.opt.bad{border-color:var(--red);background:var(--red2);animation:shake .4s}
.opt.dim{opacity:.45}
.opt .tick{position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px;font-weight:900}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shake{animation:shake .4s}
/* feedback sheet */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(110%);transition:transform .25s ease-out;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(0,0,0,.12)}
.fb{visibility:hidden}.fb.show{transform:none;visibility:visible}
.fb.good{background:#DCFCE7;border-top:4px solid var(--green)}
.fb.bad{background:#FFE4E6;border-top:4px solid var(--red)}
.fb .fbi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:900;flex:none}
.fb.good .fbi{background:var(--green)}.fb.bad .fbi{background:var(--red)}
.fb .fbt{min-width:180px;max-width:520px;flex:1}
.fb .fbt b{display:block;font-size:19px}
.fb.good .fbt b{color:#166534}.fb.bad .fbt b{color:#9F1239}
.fb .fbt span{display:block;font-size:15px;color:#334155}
.fb .fbt .ar{font-size:14px}
.fb .btns{display:flex;gap:8px}
.next{background:var(--green);color:#fff;font-weight:900;font-size:18px;border-radius:14px;padding:13px 24px;box-shadow:0 5px 0 #0F6B32;animation:nudge 1.4s 1s infinite}
.fb.bad .next{background:var(--navy);box-shadow:0 5px 0 #10183A}
.fb .alt{background:#fff;color:var(--navy);font-weight:800;border-radius:14px;padding:13px 16px;box-shadow:0 5px 0 #CBD5E1}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(4px)}}
/* write */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:14px 0 6px}
.slot{width:34px;height:44px;border-bottom:4px solid #CBD5E1;font-size:26px;font-weight:800;display:grid;place-items:center;color:var(--navy);border-radius:6px;background:#F8FAFC}
.slot.sp{width:16px;border:none;background:none}
.slot.ok{border-color:var(--green);color:var(--green);background:var(--green2)}
.slot.no{border-color:var(--red);color:var(--red);background:var(--red2)}
.slot.cur{border-color:var(--sky);animation:blink 1s infinite}
@keyframes blink{50%{background:#E0F2FE}}
.tin{width:100%;max-width:420px;font:inherit;font-size:22px;padding:12px 16px;border:3px solid var(--line);border-radius:14px;text-align:center;outline:none}
.tin:focus{border-color:var(--sky)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
/* mic */
.mic{width:96px;height:96px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;margin:10px auto 4px;box-shadow:0 8px 0 #B9383C;position:relative}
.mic svg{width:44px;height:44px}
.mic.on{animation:ring 1.2s infinite;background:#E11D48}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(225,29,72,.55)}100%{box-shadow:0 0 0 26px rgba(225,29,72,0)}}
.heard{min-height:28px;font-size:18px;margin:6px 0;color:#334155}
.heard .w{padding:1px 4px;border-radius:6px;margin:1px;display:inline-block}
.heard .w.y{background:var(--green2);color:#166534}
.heard .w.n{background:var(--red2);color:#9F1239;text-decoration:underline wavy}
.target{font-size:24px;font-weight:800;color:var(--navy);margin:6px 0}
.target.sm{font-size:19px}
.meter{height:16px;max-width:320px;margin:8px auto;background:#E5E7EB;border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .5s;border-radius:999px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
/* end */
.end{text-align:center;padding:22px}
.end .bigstars{font-size:54px;letter-spacing:6px;color:var(--sun)}
.end .bigstars i{font-style:normal;color:#E5E7EB}
.end h2{color:var(--navy);margin:6px 0}
/* cards / chips */
.chip{display:inline-flex;align-items:center;gap:6px;background:#EEF2FF;color:var(--navy);border-radius:999px;padding:8px 14px;font-weight:700;margin:4px;font-size:15px;border:2px solid transparent}
.chip:hover{border-color:#A5B4FC}
.chip svg{width:16px;height:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.tab{padding:8px 14px;border-radius:999px;background:#F1F5F9;font-weight:800;color:var(--muted);font-size:14px}
.tab.on{background:var(--teal);color:#fff}
/* dialogue */
.dl{display:flex;flex-direction:column;gap:8px;text-align:left;max-width:640px;margin:0 auto}
.ln{display:flex;gap:10px;align-items:flex-start}
.ln.r{flex-direction:row-reverse}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px}
.bub{background:#F1F5F9;border-radius:16px;padding:9px 13px;max-width:78%;border:2px solid transparent;transition:.2s}
.ln.r .bub{background:#E0F2FE}
.bub b{display:block;font-size:12px;color:var(--muted)}
.bub .en{font-size:16.5px}
.bub .ar{font-size:14px;margin-top:2px}
.bub.now{border-color:var(--sun);box-shadow:0 0 0 4px #FFF1C7}
.bub.me{border-color:var(--coral);border-style:dashed}
.key{background:#FFF1C7;border-radius:5px;padding:0 3px;font-weight:700}
.gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--sky);color:var(--sky);font-weight:800;text-align:center}
/* map */
.mapwrap{max-width:820px;margin:0 auto}
.mapwrap svg{width:100%;height:auto;display:block;border-radius:18px;touch-action:manipulation}
.bld{cursor:pointer;transition:filter .15s}
.bld:hover{filter:brightness(1.07)}
.bld.good rect.b{stroke:var(--green);stroke-width:5}
.bld.bad rect.b{stroke:var(--red);stroke-width:5}
.bld.target rect.b{stroke:var(--coral);stroke-width:5;animation:tgt 1s infinite}
@keyframes tgt{50%{stroke-opacity:.25}}
.way{background:#F8FAFC;border:2px dashed #CBD5E1;border-radius:14px;padding:10px 14px;text-align:left;margin-top:10px;font-size:16.5px;line-height:1.6}
.way .s{display:block}
.dirbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.dirb{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:800;color:var(--navy);min-width:110px}
.dirb svg{width:38px;height:38px}
.dirb:hover{border-color:var(--teal)}
.dirb.bad{border-color:var(--red);background:var(--red2);animation:shake .4s}
.dirb.glow{border-color:var(--green);animation:pop .6s infinite}
/* order */
.ordlist{display:flex;flex-direction:column;gap:8px;max-width:640px;margin:0 auto}
.oline{display:flex;gap:10px;align-items:center;background:#F8FAFC;border:3px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;font-size:16px;transition:.2s}
.oline .n{width:30px;height:30px;border-radius:50%;background:#E2E8F0;display:grid;place-items:center;font-weight:900;flex:none}
.oline.done{background:var(--green2);border-color:var(--green)}
.oline.done .n{background:var(--green);color:#fff}
.oline.bad{border-color:var(--red);background:var(--red2);animation:shake .4s}
.oline .sp{font-weight:800;color:var(--violet);margin-right:4px}
/* role cards */
.rcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:430px;margin:0 auto}
.rc{aspect-ratio:3/4;perspective:800px}
.rc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.rc.open .in{transform:rotateY(180deg)}
.rc .f,.rc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;padding:8px;box-shadow:var(--sh)}
.rc .f{background:linear-gradient(135deg,var(--violet),var(--sky));color:#fff;font-size:36px;font-weight:900}
.rc .b{background:#fff;transform:rotateY(180deg);font-weight:800;color:var(--navy)}
.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:460px;margin:10px auto}
.ck{display:flex;align-items:center;gap:8px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:700;text-align:left;font-size:14.5px}
.ck .bx{width:26px;height:26px;border-radius:8px;border:3px solid #CBD5E1;display:grid;place-items:center;color:#fff;flex:none;font-weight:900}
.ck.on{border-color:var(--green);background:var(--green2)}
.ck.on .bx{background:var(--green);border-color:var(--green)}
/* writing */
.wform{text-align:left;max-width:700px;margin:0 auto;font-size:17px;line-height:2.4}
.wform .tagw{display:inline-block;font-size:11px;font-weight:900;color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:middle;line-height:1.6}
.wf{font:inherit;font-size:16px;border:none;border-bottom:3px solid #CBD5E1;background:#F8FAFC;border-radius:6px 6px 0 0;padding:3px 8px;min-width:120px;outline:none;color:var(--navy);font-weight:700}
.wf:focus{border-color:var(--sky);background:#EFF6FF}
.wf.ok{border-color:var(--green)}
.wf{width:170px}.wf.long{width:min(460px,100%)}
select.wf{min-width:auto}
.tool{background:#FFFBEB;border:2px solid #FDE68A;border-radius:14px;padding:8px;margin-top:10px;text-align:left}
.tool b{font-size:12px;color:#92400E;text-transform:uppercase;letter-spacing:.06em;margin:0 6px}
.tool .chip{background:#fff;font-size:13.5px;padding:5px 10px;margin:3px}
.clocktxt{font-size:30px;font-weight:900;color:var(--navy);letter-spacing:.04em}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:70;display:none;place-items:center;padding:16px}
.sheet.show{display:grid}
.sheet .box{background:#fff;border-radius:22px;padding:18px;max-width:440px;width:100%}
.sheet h3{margin:0 0 10px;color:var(--navy)}
.sheet .seg{margin:6px 0;display:flex;width:100%}
.sheet .seg button{flex:1;justify-content:center}
.flash{background:#fff;border-radius:22px;padding:16px;max-width:520px;margin:0 auto;border:3px solid var(--line)}
.flash .wd{font-size:30px;font-weight:900;color:var(--navy)}
.flash .pos{display:inline-block;background:#EDE9FE;color:var(--violet);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;margin-left:6px;vertical-align:middle}
.flash .ex{font-size:18px;margin:8px 0 2px}
@media (max-width:560px){.top .logo{height:44px}.hero h1{font-size:21px}.hero svg.compass{width:60px;height:60px}.opt{font-size:17px}.rcgrid{grid-template-columns:repeat(3,1fr);gap:8px}.wform{font-size:15.5px}.checks{grid-template-columns:1fr}}

.rot{display:none}@media (max-width:560px) and (orientation:portrait){.rot{display:block}}

.recw{margin-top:14px;text-align:center}
.recrow{background:#F8FAFC;border:2px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;display:grid;gap:6px;text-align:left}
.recrow small{display:block;color:var(--muted);font-size:12px}.recrow audio{width:100%}
.cont{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#16A34A,#0FB5A6);color:#fff;border-radius:18px;padding:12px 16px;margin:12px 0 0;box-shadow:var(--sh);text-align:left;width:100%}
.cont b{font-size:17px;display:block}.cont small{opacity:.95}.cont .go{margin-left:auto;background:#fff;color:#16A34A;border-radius:12px;padding:9px 14px;font-weight:900;white-space:nowrap}

.mrow{display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 2px;text-align:left}.mrow small{display:block;color:var(--muted)}.mrow .stars{font-size:13px}
</style></head>

iver", "t": "Here we are. It's 7:55.", "ar": "وصلنا. الساعة ٧:٥٥.", "key": "Here we are", "au": "dl_work_9"}, {"sp": "Zainab", "t": "Perfect, I'm on time! Keep the change.", "ar": "ممتاز، أنا في الوقت المحدد! خلّي الباقي.", "key": "on time", "au": "dl_work_10"}]}, {"id": "students", "title": "Two students talk", "ar": "حوار بين طالبين", "info": "Hassan and Mustafa meet before class.", "cast": ["Hassan", "Mustafa"], "lines": [{"sp": "Hassan", "t": "Where do you live, Mustafa?", "ar": "أين تسكن يا مصطفى؟", "key": "Where", "au": "dl_students_0"}, {"sp": "Mustafa", "t": "I live in Al-Ashar, near the Corniche.", "ar": "أسكن في العشار، قرب الكورنيش.", "key": "near", "au": "dl_students_1"}, {"sp": "Hassan", "t": "How do you come to college?", "ar": "كيف تأتي إلى الكلية؟", "key": "How", "au": "dl_students_2"}, {"sp": "Mustafa", "t": "I come by taxi.", "ar": "آتي بالتاكسي.", "key": "by taxi", "au": "dl_students_3"}, {"sp": "Hassan", "t": "Why? Why not by bus?", "ar": "لماذا؟ لماذا ليس بالباص؟", "key": "Why", "au": "dl_students_4"}, {"sp": "Mustafa", "t": "Because there is no bus stop near my house, and the taxi is faster.", "ar": "لأنه لا يوجد موقف باص قرب بيتي، والتاكسي أسرع.", "key": "Because", "au": "dl_students_5"}, {"sp": "Hassan", "t": "When do you leave home?", "ar": "متى تخرج من البيت؟", "key": "When", "au": "dl_students_6"}, {"sp": "Mustafa", "t": "At 3:30. My class starts at 4:00.", "ar": "الساعة ٣:٣٠. يبدأ صفي الساعة ٤:٠٠.", "key": "starts", "au": "dl_students_7"}, {"sp": "Hassan", "t": "How long does it take?", "ar": "كم يستغرق الطريق؟", "key": "How long", "au": "dl_students_8"}, {"sp": "Mustafa", "t": "About twenty minutes. What about you?", "ar": "حوالي عشرين دقيقة. وأنت؟", "key": "twenty minutes", "au": "dl_students_9"}, {"sp": "Hassan", "t": "I walk, because I live very close — behind the college!", "ar": "أمشي، لأنني أسكن قريبًا جدًا — خلف الكلية!", "key": "behind", "au": "dl_students_10"}, {"sp": "Mustafa", "t": "Lucky you!", "ar": "محظوظ!", "key": "", "au" /* -- recordings in IndexedDB -- */
const RDB={db:null,
 open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{try{const q=indexedDB.open('myalmA1L1',1);q.onupgradeneeded=()=>q.result.createObjectStore('rec',{keyPath:'id'});q.onsuccess=()=>{this.db=q.result;res(this.db)};q.onerror=()=>rej(q.error)}catch(e){rej(e)}})},
 async put(r){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('rec','readwrite');t.objectStore('rec').put(r);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
 async all(){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('rec').objectStore('rec').getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>b.t-a.t));q.onerror=()=>rej(q.error)})},
 async del(id){const db=await this.open();return new Promise(res=>{const t=db.transaction('rec','readwrite');t.objectStore('rec').delete(id);t.oncomplete=()=>res()})}
};

/* ---------- generic quiz runner ---------- */
function pickOpts(item,all,k,conf){const bad=new Set();(conf||[]).forEach(gp=>{if(gp.includes(item.id))gp.forEach(x=>bad.add(x))});
 const pool=shuffle(all.filter(x=>x!==item&&!bad.has(x.id)));return shuffle([item,...pool.slice(0,k-1)])}
function runQuiz(g,mode,items,build){shell(g,mode);let list=items;let i=0,score=0;const st=$('#stage');
 if(PENDING&&PENDING.g===g.id&&PENDING.mode===mode&&PENDING.items){const back=PENDING.items.map(unJ);if(back.every(Boolean)){list=back;i=Math.min(PENDING.i,back.length-1);score=PENDING.score||0}}PENDING=null;
 const upd=()=>{$('.prog i').style.width=(100*i/list.length)+'%';$('.score .ok').textContent=score};
 function next(){i++;upd();if(i>=list.length){clearResume();return endScreen(g,mode,Math.round(100*score/list.length))}show()}
 function show(){hideFb();upd();saveResume({g:g.id,mode,i,n:list.length,score,items:list.map(J)});const r=build(list[i],mode);let first=true;
  st.innerHTML=`<p class="ask">${r.ask}${r.askAr?`<span class="ar">${r.askAr}</span>`:''}</p>${r.prompt||''}<div id="zone"></div>`;
  const z=$('#zone');const playBtn=$('.pbtn',st);if(playBtn)playBtn.onclick=()=>{sfx.tap();(r.replay||(()=>say(r.audio)))()};
  const win=async(extra)=>{if(first)score++;first=false;upd();sfx.good();const p=praise();const nav=NAV;
   feedback(true,p[0],r.answer||'',r.answerAr||'',{onNext:next});const go=fbNext;
   if(r.after){await sleep(350);if(nav!==NAV||fbNext!==go)return;await (typeof r.after==='function'?r.after():say(r.after))}
   await sleep(900/RATE[S.pace]);if(nav===NAV&&fbNext===go)go()};
  const lose=async()=>{first=false;sfx.bad();await sleep(250);
   feedback(false,'Not quite — look!',`The answer: <b>${r.answer}</b>`,r.answerAr,{onNext:next,alt:'🔊 Hear it',onAlt:()=>r.after?(typeof r.after==='function'?r.after():say(r.after)):say(r.audio)});
   if(r.after)(typeof r.after==='function'?r.after():say(r.after))};
  if(r.options){z.innerHTML=`<div class="opts ${r.options.length===3?'three':''} ${r.options[0].pic?'pics':''}">${r.options.map((o,k)=>`<button class="opt ${o.pic?'pic':''}" data-k="${k}">${o.html}</button>`).join('')}</div>`;
   if(r.anim)animateMoves(z);
   $$('.opt',z).forEach(b=>b.onclick=()=>{if(b.disabled)return;const o=r.options[+b.dataset.k];
    if(o.ok){b.classList.add('good');b.insertAdjacentHTML('beforeend','<span class="tick" style="background:#16A34A">✓</span>');$$('.opt',z).forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('dim')});win()}
    else{b.classList.add('bad');b.insertAdjacentHTML('beforeend','<span class="tick" style="background:#E11D48">✗</span>');$$('.opt',z).forEach((x,k)=>{x.disabled=true;if(r.options[k].ok)x.classList.add('good')});lose()}})}
  else if(r.write){slotWriter(z,r.write.target,r.write.alts,(ok,h)=>{if(h>1)first=false;win()});
   const sk=document.createElement('div');sk.className='row';sk.innerHTML='<button class="play ghost sm">Show answer · أظهر الإجابة</button>';z.appendChild(sk);sk.firstChild.onclick=()=>{first=false;$('.tin',z).value=r.write.target;$('.tin',z).dispatchEvent(new Event('input'))}}
  else if(r.speak){const box=document.createElement('div');z.appendChild(box);
   z.insertAdjacentHTML('afterbegin',`<div class="row"><button class="play sm ghost model">${IC.spk} Hear the model first</button></div>`);$('.model',z).onclick=()=>{sfx.tap();(r.model?r.model():say(r.audio))};
   micWidget(box,{expected:r.speak.target,onResult:res=>{
    if(res.self){res.h.insertAdjacentHTML('beforeend',`<div class="row"><button class="play sm teal ok1">I said it ✓</button><button class="play sm ghost again1">Try again</button></div>`);$('.ok1',res.h).onclick=()=>win();$('.again1',res.h).onclick=()=>{first=false;res.h.innerHTML=''};return}
    if(r.speak.type==='phrase'){const ok=[r.speak.target,...(r.speak.alts||[])].some(t=>phraseIn(t,res.heard));
     res.h.innerHTML=`<span class="w ${ok?'y':'n'}">${esc(res.text)}</span>`;
     if(ok)win();else{first=false;sfx.bad();feedback(false,'Try again',`Say: <b>${r.speak.show||r.speak.target}</b>`,'استمع للنموذج ثم حاول مرة أخرى',{next:'Skip',onNext:next,alt:'🔊 Hear it',onAlt:()=>r.model?r.model():say(r.audio)})}}

  prompt:`<div class="target" style="font-size:34px;margin:14px 0"><span class="gap">?</span> ${esc(it.t)}</div><div class="hint">at = clock & place 🎯 · in = big time 🗓️ · on = days 📅</div>`,

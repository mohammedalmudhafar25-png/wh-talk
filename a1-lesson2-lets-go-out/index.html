<script type="application/json" id="lesson-meta">{"slug": "a1-lesson2-lets-go-out", "title": "Mike & Tom: Let's Go Out!", "level": "A1", "lesson": "L2", "topic": "Present simple \u00b7 caf\u00e9s, restaurants & favorite places", "games": ["read", "listen", "write", "speak", "about"]}</script>
<style>:root{--navy:#1E2A5A;--teal:#0FB5A6;--coral:#FF5A5F;--sun:#FFC23C;--violet:#7C5CFF;--sky:#3B9DFF;--green:#16A34A;--green2:#DCFCE7;--red:#E11D48;--red2:#FFE4E6;--ink:#1F2937;--muted:#6B7280;--card:#FFFFFF;--bg:#FFF8EC;--line:#E9E2D3;--r:18px;--sh:0 6px 18px rgba(30,42,90,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 1px 1px,rgba(30,42,90,.07) 1px,transparent 0);background-size:22px 22px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;color:inherit;background:none}
.ar{font-family:"Segoe UI","Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif;direction:rtl;color:#475569}
body.noar .ar{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:3px solid var(--sun);min-height:64px}
.top .home{width:42px;height:42px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.top .home svg{width:22px;height:22px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:16px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .logo{height:56px;width:auto;flex:none;margin-left:auto}
.gear{width:42px;height:42px;border-radius:12px;background:#F1F5F9;display:grid;place-items:center;flex:none}
.gear svg{width:22px;height:22px}
main{max-width:980px;margin:0 auto;padding:14px 14px 120px}
/* settings */
.setbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:6px 0 16px}
.seg{display:inline-flex;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--sh)}
.seg button{padding:7px 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--navy);color:#fff}
.seg .lbl{padding:0 6px 0 10px;font-size:12px;font-weight:800;color:var(--muted);align-self:center;text-transform:uppercase;letter-spacing:.06em}
/* hub */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(120deg,#1E2A5A,#2E3F8F 60%,#0FB5A6);color:#fff;border-radius:24px;padding:18px 20px;box-shadow:var(--sh);overflow:hidden;position:relative}
.hero h1{margin:0;font-size:26px;letter-spacing:-.01em}
.hero p{margin:4px 0 0;opacity:.9;font-size:14px}
.hero .ar{color:#E0F2FE}
.hero svg.compass{width:84px;height:84px;flex:none}
.sec{margin:20px 4px 8px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);text-align:left;display:flex;gap:12px;align-items:center;border:2px solid transparent;transition:transform .15s,border-color .15s}
.gcard:hover{transform:translateY(-2px);border-color:var(--sun)}
.gcard .ic{width:62px;height:62px;flex:none;border-radius:16px;display:grid;place-items:center}
.gcard .ic svg{width:46px;height:46px}
.gcard b{display:block;font-size:16px;color:var(--navy)}
.gcard small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.stars{color:var(--sun);font-size:15px;letter-spacing:1px;margin-top:4px}
.stars i{font-style:normal;color:#E5E7EB}
.foot{margin-top:26px;border-top:2px solid #D1D5DB;padding-top:8px;text-align:center;font-family:Stencil,"Arial Black",Impact,sans-serif;letter-spacing:.22em;font-size:11.5px}
.foot .n{color:#6B7280}.foot .c{color:#1D4ED8}.foot .m{color:#B8860B}
/* intro / modes */
.intro{background:#fff;border-radius:24px;padding:18px;box-shadow:var(--sh);text-align:center}
.intro .big{width:96px;height:96px;margin:0 auto 6px;border-radius:24px;display:grid;place-items:center}
.intro .big svg{width:70px;height:70px}
.intro h2{margin:4px 0;color:var(--navy);font-size:24px}
.intro p{margin:2px 0;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.mode{background:#F8FAFC;border:2px solid var(--line);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.15s}
.mode:hover{border-color:var(--teal);background:#F0FDFA;transform:translateY(-2px)}
.mode .mi{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff}
.mode .mi svg{width:28px;height:28px}
.mode b{color:var(--navy);font-size:16px}
.mode small{color:var(--muted);font-size:12px}
/* play area */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog{flex:1;height:12px;background:#E5E7EB;border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--sky));border-radius:999px;transition:width .35s}
.score{font-weight:800;color:var(--navy);background:#fff;border-radius:999px;padding:5px 12px;box-shadow:var(--sh);font-size:14px;white-space:nowrap}
.score .ok{color:var(--green)}
.stage{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:16px;text-align:center;position:relative}
.ask{font-size:15px;color:var(--muted);margin:0 0 10px;font-weight:600}
.ask .ar{display:block;font-size:14px}
.scene{width:100%;max-width:420px;margin:0 auto;display:block}
.scene svg{width:100%;height:auto;display:block}
.say{font-size:13px;color:var(--violet);font-weight:700}
.play{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:999px;padding:12px 22px;font-weight:800;font-size:17px;box-shadow:0 6px 0 #10183A;transition:transform .08s}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #10183A}
.play svg{width:24px;height:24px}
.play.big{padding:22px 34px;font-size:20px}
.play.sm{padding:8px 14px;font-size:14px;box-shadow:0 4px 0 #10183A}
.play.teal{background:var(--teal);box-shadow:0 6px 0 #0B7F75}
.play.coral{background:var(--coral);box-shadow:0 6px 0 #B9383C}
.play.violet{background:var(--violet);box-shadow:0 6px 0 #5537C4}
.play.ghost{background:#EEF2FF;color:var(--navy);box-shadow:0 4px 0 #C7D2FE}
.play.playing{animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}
.opts{display:grid;gap:10px;margin-top:14px;grid-template-columns:repeat(2,1fr)}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.pics{max-width:700px;margin-left:auto;margin-right:auto}
.opt{background:#F8FAFC;border:3px solid var(--line);border-radius:16px;padding:12px 8px;font-weight:800;font-size:19px;color:var(--navy);min-height:60px;transition:transform .1s,border-color .15s,background .15s;position:relative}
.opt:hover{border-color:#94A3B8}
.opt.pic{padding:6px}
.opt.pic svg{width:100%;height:auto;display:block}
.opt.good{border-color:var(--green);background:var(--green2);animation:pop .35s}
.opt.bad{border-color:var(--red);background:var(--red2);animation:shake .4s}
.opt.dim{opacity:.45}
.opt .tick{position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px;font-weight:900}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shake{animation:shake .4s}
/* feedback sheet */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(110%);transition:transform .25s ease-out;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(0,0,0,.12)}
.fb{visibility:hidden}.fb.show{transform:none;visibility:visible}
.fb.good{background:#DCFCE7;border-top:4px solid var(--green)}
.fb.bad{background:#FFE4E6;border-top:4px solid var(--red)}
.fb .fbi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:900;flex:none}
.fb.good .fbi{background:var(--green)}.fb.bad .fbi{background:var(--red)}
.fb .fbt{min-width:180px;max-width:520px;flex:1}
.fb .fbt b{display:block;font-size:19px}
.fb.good .fbt b{color:#166534}.fb.bad .fbt b{color:#9F1239}
.fb .fbt span{display:block;font-size:15px;color:#334155}
.fb .fbt .ar{font-size:14px}
.fb .btns{display:flex;gap:8px}
.next{background:var(--green);color:#fff;font-weight:900;font-size:18px;border-radius:14px;padding:13px 24px;box-shadow:0 5px 0 #0F6B32;animation:nudge 1.4s 1s infinite}
.fb.bad .next{background:var(--navy);box-shadow:0 5px 0 #10183A}
.fb .alt{background:#fff;color:var(--navy);font-weight:800;border-radius:14px;padding:13px 16px;box-shadow:0 5px 0 #CBD5E1}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(4px)}}
/* write */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:14px 0 6px}
.slot{width:34px;height:44px;border-bottom:4px solid #CBD5E1;font-size:26px;font-weight:800;display:grid;place-items:center;color:var(--navy);border-radius:6px;background:#F8FAFC}
.slot.sp{width:16px;border:none;background:none}
.slot.ok{border-color:var(--green);color:var(--green);background:var(--green2)}
.slot.no{border-color:var(--red);color:var(--red);background:var(--red2)}
.slot.cur{border-color:var(--sky);animation:blink 1s infinite}
@keyframes blink{50%{background:#E0F2FE}}
.tin{width:100%;max-width:420px;font:inherit;font-size:22px;padding:12px 16px;border:3px solid var(--line);border-radius:14px;text-align:center;outline:none}
.tin:focus{border-color:var(--sky)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
/* mic */
.mic{width:96px;height:96px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;margin:10px auto 4px;box-shadow:0 8px 0 #B9383C;position:relative}
.mic svg{width:44px;height:44px}
.mic.on{animation:ring 1.2s infinite;background:#E11D48}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(225,29,72,.55)}100%{box-shadow:0 0 0 26px rgba(225,29,72,0)}}
.heard{min-height:28px;font-size:18px;margin:6px 0;color:#334155}
.heard .w{padding:1px 4px;border-radius:6px;margin:1px;display:inline-block}
.heard .w.y{background:var(--green2);color:#166534}
.heard .w.n{background:var(--red2);color:#9F1239;text-decoration:underline wavy}
.target{font-size:24px;font-weight:800;color:var(--navy);margin:6px 0}
.target.sm{font-size:19px}
.meter{height:16px;max-width:320px;margin:8px auto;background:#E5E7EB;border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .5s;border-radius:999px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
/* end */
.end{text-align:center;padding:22px}
.end .bigstars{font-size:54px;letter-spacing:6px;color:var(--sun)}
.end .bigstars i{font-style:normal;color:#E5E7EB}
.end h2{color:var(--navy);margin:6px 0}
/* cards / chips */
.chip{display:inline-flex;align-items:center;gap:6px;background:#EEF2FF;color:var(--navy);border-radius:999px;padding:8px 14px;font-weight:700;margin:4px;font-size:15px;border:2px solid transparent}
.chip:hover{border-color:#A5B4FC}
.chip svg{width:16px;height:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.tab{padding:8px 14px;border-radius:999px;background:#F1F5F9;font-weight:800;color:var(--muted);font-size:14px}
.tab.on{background:var(--teal);color:#fff}
/* dialogue */
.dl{display:flex;flex-direction:column;gap:8px;text-align:left;max-width:640px;margin:0 auto}
.ln{display:flex;gap:10px;align-items:flex-start}
.ln.r{flex-direction:row-reverse}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px}
.bub{background:#F1F5F9;border-radius:16px;padding:9px 13px;max-width:78%;border:2px solid transparent;transition:.2s}
.ln.r .bub{background:#E0F2FE}
.bub b{display:block;font-size:12px;color:var(--muted)}
.bub .en{font-size:16.5px}
.bub .ar{font-size:14px;margin-top:2px}
.bub.now{border-color:var(--sun);box-shadow:0 0 0 4px #FFF1C7}
.bub.me{border-color:var(--coral);border-style:dashed}
.key{background:#FFF1C7;border-radius:5px;padding:0 3px;font-weight:700}
.gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--sky);color:var(--sky);font-weight:800;text-align:center}
/* map */
.mapwrap{max-width:820px;margin:0 auto}
.mapwrap svg{width:100%;height:auto;display:block;border-radius:18px;touch-action:manipulation}
.bld{cursor:pointer;transition:filter .15s}
.bld:hover{filter:brightness(1.07)}
.bld.good rect.b{stroke:var(--green);stroke-width:5}
.bld.bad rect.b{stroke:var(--red);stroke-width:5}
.bld.target rect.b{stroke:var(--coral);stroke-width:5;animation:tgt 1s infinite}
@keyframes tgt{50%{stroke-opacity:.25}}
.way{background:#F8FAFC;border:2px dashed #CBD5E1;border-radius:14px;padding:10px 14px;text-align:left;margin-top:10px;font-size:16.5px;line-height:1.6}
.way .s{display:block}
.dirbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.dirb{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:800;color:var(--navy);min-width:110px}
.dirb svg{width:38px;height:38px}
.dirb:hover{border-color:var(--teal)}
.dirb.bad{border-color:var(--red);background:var(--red2);animation:shake .4s}
.dirb.glow{border-color:var(--green);animation:pop .6s infinite}
/* order */
.ordlist{display:flex;flex-direction:column;gap:8px;max-width:640px;margin:0 auto}
.oline{display:flex;gap:10px;align-items:center;background:#F8FAFC;border:3px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;font-size:16px;transition:.2s}
.oline .n{width:30px;height:30px;border-radius:50%;background:#E2E8F0;display:grid;place-items:center;font-weight:900;flex:none}
.oline.done{background:var(--green2);border-color:var(--green)}
.oline.done .n{background:var(--green);color:#fff}
.oline.bad{border-color:var(--red);background:var(--red2);animation:shake .4s}
.oline .sp{font-weight:800;color:var(--violet);margin-right:4px}
/* role cards */
.rcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:430px;margin:0 auto}
.rc{aspect-ratio:3/4;perspective:800px}
.rc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.rc.open .in{transform:rotateY(180deg)}
.rc .f,.rc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;padding:8px;box-shadow:var(--sh)}
.rc .f{background:linear-gradient(135deg,var(--violet),var(--sky));color:#fff;font-size:36px;font-weight:900}
.rc .b{background:#fff;transform:rotateY(180deg);font-weight:800;color:var(--navy)}
.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:460px;margin:10px auto}
.ck{display:flex;align-items:center;gap:8px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:700;text-align:left;font-size:14.5px}
.ck .bx{width:26px;height:26px;border-radius:8px;border:3px solid #CBD5E1;display:grid;place-items:center;color:#fff;flex:none;font-weight:900}
.ck.on{border-color:var(--green);background:var(--green2)}
.ck.on .bx{background:var(--green);border-color:var(--green)}
/* writing */
.wform{text-align:left;max-width:700px;margin:0 auto;font-size:17px;line-height:2.4}
.wform .tagw{display:inline-block;font-size:11px;font-weight:900;color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:middle;line-height:1.6}
.wf{font:inherit;font-size:16px;border:none;border-bottom:3px solid #CBD5E1;background:#F8FAFC;border-radius:6px 6px 0 0;padding:3px 8px;min-width:120px;outline:none;color:var(--navy);font-weight:700}
.wf:focus{border-color:var(--sky);background:#EFF6FF}
.wf.ok{border-color:var(--green)}
.wf{width:170px}.wf.long{width:min(460px,100%)}
select.wf{min-width:auto}
.tool{background:#FFFBEB;border:2px solid #FDE68A;border-radius:14px;padding:8px;margin-top:10px;text-align:left}
.tool b{font-size:12px;color:#92400E;text-transform:uppercase;letter-spacing:.06em;margin:0 6px}
.tool .chip{background:#fff;font-size:13.5px;padding:5px 10px;margin:3px}
.clocktxt{font-size:30px;font-weight:900;color:var(--navy);letter-spacing:.04em}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:70;display:none;place-items:center;padding:16px}
.sheet.show{display:grid}
.sheet .box{background:#fff;border-radius:22px;padding:18px;max-width:440px;width:100%}
.sheet h3{margin:0 0 10px;color:var(--navy)}
.sheet .seg{margin:6px 0;display:flex;width:100%}
.sheet .seg button{flex:1;justify-content:center}
.flash{background:#fff;border-radius:22px;padding:16px;max-width:520px;margin:0 auto;border:3px solid var(--line)}
.flash .wd{font-size:30px;font-weight:900;color:var(--navy)}
.flash .pos{display:inline-block;background:#EDE9FE;color:var(--violet);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;margin-left:6px;vertical-align:middle}
.flash .ex{font-size:18px;margin:8px 0 2px}
@media (max-width:560px){.top .logo{height:44px}.hero h1{font-size:21px}.hero svg.compass{width:60px;height:60px}.opt{font-size:17px}.rcgrid{grid-template-columns:repeat(3,1fr);gap:8px}.wform{font-size:15.5px}.checks{grid-template-columns:1fr}}

.rot{display:none}@media (max-width:560px) and (orientation:portrait){.rot{display:block}}

.recw{margin-top:14px;text-align:center}
.recrow{background:#F8FAFC;border:2px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;display:grid;gap:6px;text-align:left}
.recrow small{display:block;color:var(--muted);font-size:12px}.recrow audio{width:100%}
.cont{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#16A34A,#0FB5A6);color:#fff;border-radius:18px;padding:12px 16px;margin:12px 0 0;box-shadow:var(--sh);text-align:left;width:100%}
.cont b{font-size:17px;display:block}.cont small{opacity:.95}.cont .go{margin-left:auto;background:#fff;color:#16A34A;border-radius:12px;padding:9px 14px;font-weight:900;white-space:nowrap}

.mrow{display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 2px;text-align:left}.mrow small{display:block;color:var(--muted)}.mrow .stars{font-size:13px}

:root{--bg:#FFF8EC}
.top{min-height:66px;border-bottom-width:4px}
.top .tabn{background:#FF5A5F;color:#fff;font-weight:900;border-radius:10px;padding:8px 10px;flex:none;box-shadow:0 3px 0 #B9383C}
.top .ttl b{font-size:16.5px}.top .logo{height:58px}
main{padding-bottom:130px}
/* hero */
.hero2{position:relative;border-radius:24px;overflow:hidden;box-shadow:var(--sh);background:#BDE8FF}
.hero2 .scn svg{display:block;width:100%;height:auto}
.hero2 .htx{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 14px;background:linear-gradient(180deg,rgba(30,42,90,0),rgba(30,42,90,.88) 38%);color:#fff}
.kick{display:inline-block;background:#FFC23C;color:#1E2A5A;font-weight:900;font-size:11.5px;letter-spacing:.14em;border-radius:999px;padding:3px 11px}
.hero2 h1{margin:6px 0 2px;font-size:clamp(26px,5.5vw,40px);line-height:1.05}.hero2 h1 b{color:#FFC23C}
.hero2 p{margin:0;font-size:14.5px;opacity:.95}.hero2 .ar{color:#E0F2FE;font-size:14px}
.hero2 .play{margin-top:8px}
@media(min-width:761px){.hero2{display:grid;grid-template-columns:1fr 1.25fr;background:#1E2A5A}.hero2 .htx{position:static;background:none;display:flex;flex-direction:column;justify-content:center;order:-1;padding:18px 22px}.hero2 .scn{align-self:center;padding:10px 10px 10px 0}.hero2 .scn svg{border-radius:18px}}
@media(max-width:760px){.hero2 .htx{position:static;background:#1E2A5A}}
.scn.sm{max-width:520px;margin:0 auto 8px}.scn.sm svg{width:100%;height:auto;display:block;border-radius:16px}
/* controls panel — separate from activities */
.panel{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:10px 12px;margin:14px 0 10px;border:2px dashed #E9E2D3}
.panel .ph{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px 4px}
.panel .ph svg{width:16px;height:16px}
.ctlp{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center}
.cg{display:flex;align-items:center;gap:7px}
.cg .lbl{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;line-height:1.05;text-align:right}
.cg .lbl small{display:block;text-transform:none;letter-spacing:0;font-size:11px}
.cg b{min-width:42px;font-size:13px;color:var(--navy);font-variant-numeric:tabular-nums}
.ctlp .seg{box-shadow:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:28px;background:transparent;touch-action:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--teal) var(--p,50%),#E5E7EB var(--p,50%))}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:#E5E7EB}input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--teal)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:5px solid var(--navy);margin-top:-8px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:5px solid var(--navy)}
.sheet .ctlp{flex-direction:column;align-items:stretch}.sheet .cg{justify-content:space-between}.sheet .cg .lbl{text-align:left;min-width:70px}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:4px 0 6px}
.acts .play{font-size:15px;padding:10px 16px}
/* bus route */
.route{display:flex;flex-direction:column;gap:0}
.stop{display:flex;gap:10px;align-items:stretch}
.rail{width:46px;flex:none;position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;margin-left:-3px;width:6px;background:repeating-linear-gradient(180deg,#CBD5E1 0 10px,transparent 10px 18px)}
.stop:first-child .rail::before{top:50%}.stop:last-child .rail::before{bottom:50%}
.dot{position:relative;z-index:1;align-self:center;width:34px;height:34px;border-radius:50%;border:4px solid;display:grid;place-items:center;font-weight:900;color:#1E2A5A;background:#fff;font-size:15px}
.stop.done .dot{color:#fff}
.busi{position:absolute;z-index:2;left:-6px;top:4px;width:40px;animation:bob 1.6s ease-in-out infinite}.busi svg{width:40px;height:40px}
@keyframes bob{50%{transform:translateY(-4px)}}
.scard{flex:1;display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 12px;margin:6px 0;box-shadow:var(--sh);text-align:left;border:2px solid transparent;border-left:8px solid var(--c);transition:transform .15s}
.scard:hover{transform:translateY(-2px);border-color:var(--c)}
.stop.here .scard{box-shadow:0 0 0 4px var(--t),var(--sh)}
.sic{width:54px;height:54px;flex:none;border-radius:16px;background:var(--t);display:grid;place-items:center}.sic svg{width:42px;height:42px}
.stx{flex:1;min-width:0}.stx small{display:block;font-size:11px;font-weight:900;color:var(--c);letter-spacing:.1em}.stx b{display:block;font-size:17px;color:var(--navy)}
.stx em{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}.stx .ar{display:block;font-size:13px}
.scard .stars{font-size:16px;white-space:nowrap}
.foot .sep{color:#9CA3AF}
/* level page */
.intro{border-top:8px solid var(--c)}
.intro .big svg{width:72px;height:72px}
.intro>p:not(.ar){max-width:560px;margin:6px auto 0;font-size:15px;color:#334155}
.mode{position:relative}.mode .mn{position:absolute;top:8px;left:10px;font-weight:900;color:#CBD5E1;font-size:15px}.mode .stars{font-size:15px}
.insb{display:flex;align-items:center;gap:10px;background:var(--card);border-left:6px solid var(--c);border-radius:14px;padding:6px 12px 6px 6px;margin-bottom:10px;box-shadow:var(--sh);text-align:left;font-weight:600;color:#334155;font-size:14.5px}
.ib2{width:38px;height:38px;flex:none;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}.ib2 svg{width:20px;height:20px}
.hud .bk{padding:6px 12px;box-shadow:0 3px 0 #C7D2FE}
/* content pieces */
.qbig{font-size:22px;font-weight:800;color:var(--navy);margin:6px 0;line-height:1.3}.qbig.sm{font-size:19px}
.kw{color:#7B2FF7;font-weight:800;border-bottom:2px dotted #7B2FF7;cursor:pointer}
.avs{width:44px;height:44px;flex:none}.avs svg{width:44px;height:44px}
.bub b i{font-style:normal;color:#94A3B8;font-weight:700;font-size:11px;margin-left:4px}
.ln{cursor:pointer;align-items:center}.lpic{width:34px;height:34px;flex:none;opacity:.95}.lpic svg{width:34px;height:34px}
.hidetx .bub .en,.hidetx .bub .ar{filter:blur(7px);transition:filter .2s}.hidetx .ln.peek .bub .en,.hidetx .ln.peek .bub .ar,.hidetx .bub.now .en,.hidetx .bub.now .ar{filter:none}
.match2{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto}
.mc{display:flex;flex-direction:column;gap:10px}
.mcard{display:flex;align-items:center;gap:10px;background:#F8FAFC;border:3px solid var(--line);border-radius:16px;padding:6px 12px;font-size:18px;color:var(--navy);text-transform:capitalize;transition:.15s}
.mcard svg{width:52px;height:52px;flex:none}
.mcard.sel{border-color:var(--sky);background:#E0F2FE;transform:translateX(4px)}.mcard.ok{border-color:var(--green);background:var(--green2)}.mcard.bad{border-color:var(--red);background:var(--red2);animation:shake .4s}
.said{min-height:30px;font-size:18px;font-weight:800;color:#16A34A;margin-top:12px}
.wpic{width:110px;height:110px;margin:0 auto}.wpic svg{width:100%;height:100%}.wpic.sm{width:60px;height:60px}.wpic.xs{width:42px;height:42px;flex:none}
.flash .say{margin:4px 0}.flash .say b{color:#FF2E88}
.fam{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}.fam>span{background:#F1F5F9;border-radius:999px;padding:4px 10px;font-size:14px;font-weight:700}.fam i{font-weight:400;color:var(--muted)}.fam .ar{font-size:13px}
.mono{font-family:Consolas,"DejaVu Sans Mono",monospace;letter-spacing:.04em}
.sform{display:flex;align-items:center;justify-content:center;gap:14px;font-size:26px;margin:8px 0}.sform b{color:#7B2FF7}.sform .q{color:#FF5A5F}.sform .arw{color:#FFC23C;font-size:30px}
.boss{display:inline-block;background:#1E2A5A;color:#FFC23C;font-weight:900;letter-spacing:.12em;border-radius:999px;padding:6px 16px;margin-bottom:4px}
.trick{max-width:420px;margin:6px auto;background:#FFFBEB;border:2px solid #FDE68A;border-radius:12px;padding:6px 10px;text-align:left;font-weight:600}.trick summary{cursor:pointer;color:#92400E;font-weight:800}
.who2{display:flex;flex-direction:column;align-items:center;gap:4px}.who2 svg{width:84px;height:84px}
.det{width:64px;margin:0 auto}.det svg{width:64px;height:64px}
.dig{font-weight:900;color:var(--navy);font-size:15px;margin-top:2px}
.opt.pic svg{max-width:120px;margin:0 auto}
.tfx{font-size:22px;font-weight:900}.tfx.ok{color:#16A34A}.tfx.no{color:#E11D48}
.samc{display:flex;align-items:center;justify-content:center;gap:10px}.samc>svg{width:96px;height:96px}.samc .plus{font-size:28px;font-weight:900;color:#FFC23C}.samc .wpic{width:84px;height:84px}
.cue{display:inline-block;background:#EEF2FF;color:var(--navy);border-radius:999px;padding:6px 16px;font-size:16px;margin:8px 0;font-weight:600}
.tl2{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:8px 0}
@media(max-width:620px){.tl2{grid-template-columns:repeat(4,1fr)}}
.ev{background:#F8FAFC;border:3px solid var(--line);border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;color:var(--navy);transition:.15s}
.ev.seen{border-color:#C4B5FD}.ev.on{border-color:#7B2FF7;background:#EEE5FF;transform:translateY(-3px)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.pair.pop{animation:pop .4s}
@media(max-width:560px){.pair{grid-template-columns:1fr}}
.pi{display:flex;align-items:center;gap:10px;background:#E0F2FE;border-radius:16px;padding:8px 12px;text-align:left}.pi svg{width:52px;height:52px;flex:none}
.pi small{display:block;color:var(--muted);font-weight:700}.pi b{font-size:18px;color:var(--navy)}
.pi.he{background:#EEE5FF}.hebig{width:52px;height:52px;flex:none;border-radius:50%;background:#7B2FF7;color:#fff;font-weight:900;font-size:20px;display:grid;place-items:center}
.s{color:#FF2E88;font-weight:900;background:#FFE3F0;border-radius:4px;padding:0 2px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
@media(max-width:620px){.rules{grid-template-columns:1fr}}
.rule{border:2px solid var(--c);border-radius:16px;padding:8px 12px;background:#fff}.rule h4{margin:0 0 6px;color:var(--c)}.rule p{margin:4px 0}
.rule table{width:100%;border-collapse:collapse;font-size:14px}.rule td{padding:3px 4px;border-top:1px dashed #E5E7EB}.rule td:first-child{font-weight:800;color:var(--muted);font-size:12px}
.fbar{display:flex;border-radius:10px;overflow:hidden;font-weight:800;font-size:12.5px;color:#fff;text-align:center}.fbar span{flex:1;padding:4px 0}
.chip i{font-style:normal;color:var(--muted)}
.fswg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;text-align:left}
.fc{background:#F8FAFC;border:2px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px}.fc.ok{border-color:var(--green);background:var(--green2)}
.fq{display:flex;gap:8px;align-items:center;text-align:left}.fq small{display:block;color:var(--muted);font-size:11.5px}.fq b{display:block;color:var(--navy);font-size:15.5px}
.fq em{display:flex;align-items:center;gap:4px;font-style:normal;color:#16A34A;font-size:13px;font-weight:700}.fq em svg{width:15px;height:15px}
.fc input{font:inherit;border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;color:var(--navy);background:#fff}
.model{margin-top:12px;background:#ECFDF5;border:2px solid #A7F3D0;border-radius:14px;padding:10px;font-size:15px}
.mm{display:flex;gap:12px;align-items:center;justify-content:center;background:#FFF6CC;border:2px solid #FFD60A;border-radius:16px;padding:10px;margin:10px auto;max-width:440px;text-align:left}.mm>span svg{width:56px;height:56px}
.pic{display:inline-block}.pic svg{width:100%;height:auto}

.wf.long{width:min(330px,62%)}.wform{line-height:2.6}
/* ===== v2: café palette, Ralph/Walter header, better buttons ===== */
:root{--navy:#3B2618;--teal:#1FA38A;--coral:#E2462C;--sun:#FFB627;--violet:#B5389C;--sky:#0A95C9;--bg:#FFF6EA;--line:#EADCC6;--ink:#2A1C12;--muted:#7A6555;--sh:0 8px 22px rgba(59,38,24,.12)}
body{background:#FFF6EA;background-image:radial-gradient(circle at 1px 1px,rgba(107,62,38,.09) 1px,transparent 0);background-size:22px 22px}
.top{position:relative;top:auto;z-index:31;display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:0;background:#fff;border-bottom:3px solid #FFB627;backdrop-filter:none}
.top .tab{flex:0 0 auto;background:#3E2723;color:#FFB627;font-weight:800;border-radius:8px;padding:3px 10px;font-size:13px;min-width:44px;text-align:center;box-shadow:none}
.top .ttl{flex:1;text-align:center;font-weight:700;font-size:12.5px;letter-spacing:.3px;color:#2A1C12;min-width:0}
.top .ttl span{background:linear-gradient(transparent 15%,#FFD8A8 15%);padding:2px 8px;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone;line-height:1.7}
.top img{height:76px;width:auto;flex:0 0 auto;margin:-14px -6px}
@media(max-width:640px){.top .ttl{font-size:10.5px}.top img{height:60px;margin:-10px -6px}}
.navr{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:7px 12px;background:rgba(255,250,242,.96);backdrop-filter:blur(6px);border-bottom:4px solid #FFB627}
.navr .home{width:42px;height:42px;border-radius:14px;background:linear-gradient(180deg,#5A3A28,#3B2618);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 #22140c}
.navr .home svg{width:22px;height:22px}
.navr .ttl2{flex:1;min-width:0}.navr .ttl2 b{display:block;font-size:16px;color:#3B2618;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.navr .ttl2 small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navr .gear{background:#FFF1DC;border:2px solid #F3D9B5}
/* hero */
.hero2{background:#3B2618!important}.hero2 .htx{background:linear-gradient(180deg,rgba(59,38,24,0),rgba(59,38,24,.92) 38%)}
@media(min-width:761px){.hero2 .htx{background:none}}@media(max-width:760px){.hero2 .htx{background:#3B2618}}
.kick{background:#FFB627;color:#3B2618}.hero2 h1 b{color:#FFB627}
/* better buttons */
.play{position:relative;background:linear-gradient(180deg,#6A4430,#3B2618);color:#fff;border-radius:16px;padding:12px 22px;font-weight:800;letter-spacing:.2px;box-shadow:0 5px 0 #22140c,0 10px 18px rgba(59,38,24,.22);transition:transform .1s,box-shadow .1s,filter .15s}
.play:hover{filter:brightness(1.08);transform:translateY(-1px)}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 #22140c,0 3px 8px rgba(59,38,24,.2)}
.play svg{background:rgba(255,255,255,.18);border-radius:50%;padding:3px;width:28px;height:28px}
.play.sm svg{width:22px;height:22px;padding:2px}
.play.teal{background:linear-gradient(180deg,#36C3A8,#1A917A);box-shadow:0 5px 0 #11695A,0 10px 18px rgba(31,163,138,.25)}
.play.coral{background:linear-gradient(180deg,#F56A4E,#D23A21);box-shadow:0 5px 0 #9B2A17,0 10px 18px rgba(226,70,44,.25)}
.play.violet{background:linear-gradient(180deg,#CC52B3,#9C2C86);box-shadow:0 5px 0 #6E1E5F,0 10px 18px rgba(181,56,156,.25)}
.play.ghost{background:#FFF1DC;color:#3B2618;border:2px solid #F3D9B5;box-shadow:0 4px 0 #E8C99C}
.play.ghost svg{background:#fff}
.play.big{border-radius:20px}
.mode{background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 #EADCC6;padding:16px 10px 12px}
.mode:hover{border-color:var(--c,#FFB627);box-shadow:0 7px 0 #EADCC6;transform:translateY(-3px);background:#fff}
.mode .mi{width:58px;height:58px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 #EADCC6}
.opt:hover{border-color:#D9B98F;transform:translateY(-2px)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #EADCC6}
.opt.good{box-shadow:0 5px 0 #8FD3A6}.opt.bad{box-shadow:0 5px 0 #F3A3B2}
.tab{background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 #EADCC6;color:#7A6555}.tab.on{background:linear-gradient(180deg,#36C3A8,#1A917A);border-color:#1A917A;color:#fff;box-shadow:0 3px 0 #11695A}
.scard{border-radius:20px;box-shadow:0 5px 0 #EADCC6,var(--sh)}
.mcard{background:#fff;box-shadow:0 4px 0 #EADCC6}
.gear{border-radius:14px}
.ln.sara .bub{background:#FFE7DF}.ln.sara .bub b{color:#E2462C!important}
.foot .m{color:#B8860B}
.insb{background:#fff}
.seg button.on{background:#3B2618}
input[type=range]::-webkit-slider-thumb{border-color:#3B2618}input[type=range]::-moz-range-thumb{border-color:#3B2618}
.wform .wf{field-sizing:content;min-width:110px;max-width:100%}.wform .wf.long{min-width:150px}
</style></head>

": "وآني هم! هو المقهى المفضل عندي بالمدينة.", "au": "s2", "keys": ["favorite"], "key": "favorite", "pic": null}, {"n": 4, "sp": "Mike", "t": "Really? Why do you like it?", "ar": "صدگ؟ ليش تحبه؟", "au": "s3", "keys": [], "key": "", "pic": null}, {"n": 5, "sp": "Tom", "t": "Well, it's quiet, the music is nice, and the cakes are amazing!", "ar": "يعني، هادئ، والموسيقى حلوة، والكيك روعة!", "au": "s4", "keys": ["quiet", "amazing"], "key": "quiet", "pic": "cake"}, {"n": 6, "sp": "Mike", "t": "Ha-ha, true! I always sit by the window. I love the view of the river.", "ar": "هههه صح! دائماً أگعد يم الشباك. أحب منظر النهر.", "au": "s5", "keys": ["sit by the window", "view"], "key": "sit by the window", "pic": "window"}, {"n": 7, "sp": "Sara", "t": "Good morning, guys! What would you like?", "ar": "صباح الخير يا شباب! شنو تحبون تطلبون؟", "au": "s6", "keys": ["What would you like"], "key": "What would you like", "pic": "menu"}, {"n": 8, "sp": "Mike", "t": "Can I have a hot chocolate and a cheese sandwich, please?", "ar": "ممكن هوت چوكليت وسندويچ جبن، رجاءً؟", "au": "s7", "keys": ["Can I have", "hot chocolate", "sandwich"], "key": "Can I have", "pic": "hotchoc"}, {"n": 9, "sp": "Tom", "t": "And a coffee and a piece of chocolate cake for me, please.", "ar": "وآني قهوة وقطعة كيك چوكليت، رجاءً.", "au": "s8", "keys": ["coffee", "a piece of"], "key": "coffee", "pic": "coffee"}, {"n": 10, "sp": "Sara", "t": "Sure! Anything else?", "ar": "أكيد! شي ثاني؟", "au": "s9", "keys": ["Anything else"], "key": "Anything else", "pic": null}, {"n": 11, "sp": "Tom", "t": "No, thanks. That's all.", "ar": "لا، شكراً. بس هذا.", "au": "s10", "keys": ["That's all"], "key": "That's all", "pic": null}, {"n": 12, "sp": "Mike", "t": "So, Tom, do you drink coffee every day?", "ar": "زين توم، تشرب قهوة كل يوم؟", "au": "s11", "keys": ["drink"], "key": "drink", "pic": null}, {"n": 13, "sp": "Tom", "t": "Oh, yes! I drink three cups a day. I can't start my day without it!", "ar": "إي والله! أشرب ثلاث كوبات باليوم. ما أگدر أبدي يومي بدونها!", "au": "s12", "keys": ["three cups a day"], "key": "three cups a day", "pic": null}, {"n": 14, "sp": "Mike", "t": "Three cups? Wow! I don't drink coffee. I usually drink tea.", "ar": "ثلاث كوبات؟ واو! آني ما أشرب قهوة. عادةً أشرب شاي.", "au": "s13", "keys": ["don't drink", "usually"], "key": "don't drink", "pic": "tea"}, {"n": 15, "sp": "Sara", "t": "Here you are! One hot chocolate, one sandwich, one coffee, and one cake.", "ar": "تفضلوا! هوت چوكليت، سندويچ، قهوة، وكيك.", "au": "s14", "keys": ["Here you are"], "key": "Here you are", "pic": "tray"}, {"n": 16, "sp": "Mike", "t": "Thank you so much!", "ar": "شكراً جزيلاً!", "au": "s15", "keys": [], "key": "", "pic": null}, {"n": 17, "sp": "Tom", "t": "Mmm! This cake is delicious!", "ar": "ممم! هذا الكيك لذيذ!", "au": "s16", "keys": ["delicious"], "key": "delicious", "pic": null}, {"n": 18, "sp": "Mike", "t": "Where do you usually go in the evening, Tom?", "ar": "وين عادةً تروح بالمساء يا توم؟", "au": "s17", "keys": ["in the evening"], "key": "in the evening", "pic": null}, {"n": 19, "sp": "Tom", "t": "I often go to the park by the river. I sit on a bench and relax. And you?", "ar": "هواية أروح للحديقة يم النهر. أگعد على مصطبة وأرتاح. وإنت؟", "au": "s18", "keys": ["bench", "relax"], "key": "bench", "pic": "bench"}, {"n": 20, "sp": "Mike", "t": "I usually go to the mall with my friends. We play games and eat ice cream.", "ar": "عادةً أروح للمول ويه أصدقائي. نلعب ألعاب وناكل آيس كريم.", "au": "s19", "keys": ["mall", "ice cream"], "key": "mall", "pic": "icecream"}, {"n": 21, "sp": "Tom", "t": "Hey, do you like fish?", "ar": "يا معوّد، تحب السمك؟", "au": "s20", "keys": ["fish"], "key": "fish", "pic": null}, {"n": 22, "sp": "Mike", "t": "Yes, I love fish! Why?", "ar": "إي، أموت على السمك! ليش؟", "au": "s21", "keys": [], "key": "", "pic": "fish"}, {"n": 23, "sp": "Tom", "t": "My brother, Sam, works at a restaurant. It's called The River Grill. He cooks amazing grilled fish.", "ar": "أخوي سام يشتغل /* text matching */
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,fifteen:15,twenty:20,thirty:30,forty:40,fifty:50,'forty-five':45,'fifty-five':55,thousand:'000'};
function norm(s){return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/(\d+):(\d\d)/g,'$1 $2').replace(/,(\d{3})/g,'$1').replace(/[^a-z0-9'\- ]+/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim()}
function toks(s){const a=norm(s).split(' ').filter(Boolean).map(w=>NUMW[w]!=null?String(NUMW[w]):w.replace(/'s$/,'').replace(/^(it|that|what|here|let|i|you|we|don|can|isn)'.*$/,'$1'));
 const o=[];for(let i=0;i<a.length;i++){const n=+a[i];if([20,30,40,50].includes(n)&&a[i+1]&&/^[1-9]$/.test(a[i+1])){o.push(String(n+ +a[i+1]));i++}else if(a[i]==='00'){}else o.push(a[i])}return o}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const HOMO=[['to','two','too','2'],['for','four','4'],['right','write'],['by','buy','bye'],['there','their'],['hear','here'],['one','won','1'],['eight','ate','8']];
function wmatch(a,b){return a===b||(a.length>=4&&lev(a,b)<=1)||HOMO.some(h=>h.includes(a)&&h.includes(b))}
function scoreSpeech(expected,heardList){const E=toks(expected);let best={pct:0,marks:E.map(()=>false)};
 for(const h of heardList){const H=toks(h);const used=H.map(()=>false);const marks=E.map(w=>{const i=H.findIndex((x,k)=>!used[k]&&wmatch(w,x));if(i>=0){used[i]=true;return true}return false});
  const pct=Math.round(100*marks.filter(Boolean).length/Math.max(1,E.length));if(pct>best.pct)best={pct,marks}}
 best.words=expected.split(/\s+/);return best}
function phraseIn(target,heardList){const T=toks(target).join(' ');return heardList.some(h=>{const H=toks(h).join(' ');if(H.includes(T))return true;const tw=T.split(' '),hw=H.split(' ');
  for(let i=0;i+tw.length<=hw.length;i++){if(tw.every((w,k)=>wmatch(w,hw[i+k])))return true}return false})}
function normType(s){return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?,]+$/,'').replace(/\s+/g,' ').trim()}

 if(auto){clearTimeout(feedback.t);feedback.t=setTimeout(()=>{if(fbNext===go)go()},auto/S.rate)}}

/* mic widget: returns element; calls onResult({heard:[...],text}) or fallback */
function micWidget(box,{expected,onResult,label='Tap and say it',maxMs=6000,continuous=false,onInterim}){
 box.innerHTML=`<button class="mic" aria-label="Speak">${IC.mic}</button><div class="hint">${label}<span class="ar"> — اضغط وتكلم</span></div><div class="heard"></div>`;
 const m=$('.mic',box),h=$('.heard',box);let busy=false;
 m.onclick=async()=>{if(busy){recognize.stop&&recognize.stop();recordClip.stop&&recordClip.stop();return}busy=true;stopAudio();m.classList.add('on');h.innerHTML='<span style="color:#94A3B8">Listening… أنا أسمعك</span>';
  if(canSR()){const r=await recognize({continuous,maxMs,onInterim:t=>{h.textContent=t;onInterim&&onInterim(t)}});m.classList.remove('on');busy=false;
   if(r.err&&(srBroken||r.err==='nosr')&&!r.text){h.innerHTML='';return fallback()}
   if(!r.text){h.innerHTML='<span style="color:#E11D48">I didn\'t hear you. Tap the mic and speak louder. <span class="ar">لم أسمعك، تكلّم بصوت أعلى</span></span>';sfx.bad();return}
   onResult({heard:[r.text,...(r.alts||[])],text:r.text,h})}
  else{m.classList.remove('on');busy=false;fallback()}
 };
 async function fallback(){h.innerHTML='<span style="color:#7C5CFF">Recording… speak now! Tap the mic to stop. <span class="ar">سجّل صوتك الآن</span></span>';m.classList.add('on');busy=true;
  const u=await recordClip(maxMs);m.classList.remove('on');busy=false;
  if(!u){h.innerHTML='<span>Microphone is not available here. Say it out loud, then tap “I said it”.</span>';onResult({self:true,h});return}
  h.innerHTML=`<audio src="${u}" controls style="max-width:100%"></audio>`;if(recordClip.blob&&typeof keepRecording==='function')keepRecording(recordClip.blob,(expected?String(expected).slice(0,60):'Speaking practice'));onResult({self:true,h,url:u})}
 return m}
function colorWords(res){return res.words.map((w,i)=>`<span class="w ${res.marks[i]?'y':'n'}">${esc(w)}</span>`).join(' ')}

/* letter slots (write mode with live feedback) */
function slotWriter(box,target,alts,onDone){
 box.innerHTML=`<div class="slots"></div><input class="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type here… اكتب هنا"><div class="row"><button class="play ghost sm hintb">${IC.bulb} Hint</button><button class="play teal sm chk">Check ✓</button></div>`;
 const sl=$('.slots',box),inp=$('.tin',box);let hints=0,done=false;
 const T=target;const nq=s=>s.replace(/[’‘`]/g,"'");function render(){const v=nq(inp.value.toLowerCase());sl.innerHTML=[...T].map((ch,i)=>{if(ch===' ')return '<div class="slot sp"></div>';const c=v[i];let cl='';if(c!=null){cl=c===ch.toLowerCase()?'ok':'no'}else if(i===v.length)cl='cur';return `<div class="slot ${cl}">${c!=null?esc(c):''}</div>`}).join('')}
 function check(force){if(done)return;const v=normType(inp.value);const okAll=[T,...(alts||[])].some(a=>normType(a)===v);
  if(okAll){done=true;inp.blur();onDone(true,hints)}else if(force){sfx.bad();inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400);
   const v2=nq(inp.value.toLowerCase());let k=0;while(k<v2.length&&v2[k]===T[k].toLowerCase())k++;toast(k<v2.length?`Letter ${k+1} is wrong. Fix the red letter. <span class="ar">صحّح الحرف الأحمر</span>`:'Keep going — not finished. <span class="ar">أكمل الكلمة</span>')}}
 inp.oninput=()=>{const v=nq(inp.value.toLowerCase());const last=v.length-1;if(last>=0&&last<T.length){if(v[last]===T[last].toLowerCase())sfx.pop();else sfx.bad()}render();if(normType(inp.value)===normType(T))check()};
 inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();check(true)}};
 $('.chk',box).onclick=()=>check(true);
 $('.hintb',box).onclick=()=>{let v=inp.value;let k=0;while(k<v.length&&k<T.length&&v[k].toLowerCase()===T[k].toLowerCase())k++;inp.value=T.slice(0,k+1);hints++;render();inp.focus();if(normType(inp.value)===normType(T))check()};
 render();setTimeout(()=>inp.focus(),200);
 return{reveal(){inp.value=T;render()}}}

/* stars per activity; level = average */
const SK=(g,m)=>g+'.'+m;
function modeStars(g,m){return store.get('stars',{})[SK(g,m)]||0}

    if(res.self){res.h.insertAdjacentHTML('beforeend',`<div class="row"><button class="play sm teal ok1">I said it ✓</button><button class="play sm ghost again1">Try again</button></div>`);$('.ok1',res.h).onclick=()=>win();$('.again1',res.h).onclick=()=>{first=false;res.h.innerHTML=''};return}
    if(r.speak.type==='phrase'){const ok=[r.speak.target,...(r.speak.alts||[])].some(t=>phraseIn(t,res.heard));
     res.h.innerHTML=`<span class="w ${ok?'y':'n'}">${esc(res.text)}</span>`;
     if(ok)win();else{first=false;sfx.bad();feedback(false,'Try again',`Say: <b>${r.speak.show||r.speak.target}</b>`,'استمع للنموذج ثم حاول مرة أخرى',{next:'Skip',onNext:next,alt:'🔊 Hear it',onAlt:()=>r.model?r.model():say(r.audio)})}}
    else{const sc=scoreSpeech(r.speak.target,res.heard);res.h.innerHTML=colorWords(sc)+`<div class="meter"><i style="width:${sc.pct}%;background:${sc.pct>=70?'#16A34A':sc.pct>=40?'#F59E0B':'#E11D48'}"></i></div><b>${sc.pct}%</b>`;
     if(sc.pct>=70)win();else{first=false;sfx.bad();feedback(false,sc.pct>=40?'Almost! Say the red words again.':'Try again, slowly.',`Red words = say them again.`,'الكلمات الحمراء: أعد نطقها',{next:'Skip',onNext:next,alt:'🔊 Hear it',onAlt:()=>r.model?r.model():say(r.audio)})}}
   }})}
  if(r.onShow)r.onShow(st);if(r.audio&&r.autoplay!==false){const nav=NAV,me=list[i];(INTROP||sleep(250)).then(()=>{INTROP=null;if(nav===NAV&&list[i]===me&&!$('#fb').classList.contains('show'))say(r.audio)})}else INTROP=null}
 show()}
const pbtn=(t='Listen again')=>`<div class="row" style="margin:6px 0 10px"><button class="play big pbtn">${IC.spk} ${t}</button></div>`;
const pbtnSm=(t='Hear it')=>`<div class="row" style="margin:6px 0"><button class="play sm pbtn">${IC.spk} ${t}</button></div>`;
/* 8. dialogues */
function bubble(l,cast,i,extra=''){const r=cast.indexOf(l.sp)===1;return `<div class="ln ${r?'r':''}" data-i="${i}">${AVC[l.sp]?`<div class="avs">${PIC[AVC[l.sp]]}</div>`:`<div class="av" style="background:${SPC[l.sp]||'#64748B'}">${l.sp[0]}</div>`}<div class="bub ${extra}"><b>${l.sp}</b><div class="en">${l.html||(l.keys?storyHTML(l.t,l.keys):hl(l.t,l.key))}</div><div class="ar">${l.ar}</div></div></div>`}
function hl(t,key){if(!key)return esc(t);const i=t.toLowerCase().indexOf(key.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+`<span class="key">${esc(t.slice(i,i+key.length))}</span>`+esc(t.slice(i+key.length))}
function dialogueGame(g,mode,di=0){const LIST=mode==='role'?D.storyParts:D.dialogues;const sm=mode==='dlisten'?'listen':mode;shell(g,sm);PENDING=null;saveResume({g:g.id,mode:sm,tab:di});const st=$('#stage');const DL=LIST[di];
 const head=`<div class="tabs">${LIST.map((d,j)=>`<button class="tab ${j===di?'on':''}" data-j="${j}">${d.ic?`<span class="wpic xs" style="display:inline-block;vertical-align:middle;width:26px;height:26px">${PIC[d.ic]}</span> `:''}${d.title}</button>`).join('')}</div><p class="ask"><b style="color:#1E2A5A">${DL.title}</b>${DL.info?' — '+esc(DL.info):''}<span class="ar">${DL.ar}</span></p>`;
 const bindTabs=()=>$$('.tab',st).forEach(b=>b.onclick=()=>{stopAudio();dialogueGame(g,mode,+b.dataset.j)});
 if(mode==='dlisten'){st.innerHTML=head+`<div class="row" style="margin-bottom:12px"><button class="play" id="pa">${IC.play} Play all</button><button class="play ghost sm" id="ps">■ Stop</button></div><div class="dl">${DL.lines.map((l,i)=>bubble(l,DL.cast,i)).join('')}</div><p class="hint">Tap any line to hear it again. Yellow = key words. <span class="ar">اضغط أي سطر لسماعه</span></p>`;bindTabs();
  let playing=false;const hiL=i=>{$$('.bub',st).forEach((b,k)=>b.classList.toggle('now',k===i));const el=$$('.ln',st)[i];el&&el.scrollIntoView({behavior:'smooth',block:'center'})};
  $('#pa').onclick=async()=>{if(playing){stopAudio();return}playing=true;$('#pa').innerHTML='■ Stop';const nav=NAV;let all=true;for(let i=0;i<DL.lines.length;i++){hiL(i);$('.prog i').style.width=(100*(i+1)/DL.lines.length)+'%';const ok=await say(DL.lines[i].au);if(!ok||nav!==NAV){all=false;break}await sleep(450/S.rate)}if(nav!==NAV)return;playing=false;$('#pa').innerHTML=IC.play+' Play all';hiL(-1);if(all){const pd=store.get('dlgDone_'+g.id,{});pd[di]=1;store.set('dlgDone_'+g.id,pd);const nd=Object.keys(pd).length;setStars(SK(g.id,'listen'),nd>=LIST.length?3:nd>=2?2:1);toast('Now try Role-play! 🎭 <span class="ar">جرّب تمثيل الدور الآن</span>',2500)}};
  $('#ps').onclick=()=>stopAudio();$$('.ln',st).forEach(el=>el.onclick=()=>{if(playing)return;const i=+el.dataset.i;hiL(i);say(DL.lines[i].au)});return}
 if(mode==='role'||mode==='order'){st.innerHTML=head+`<div class="row" style="margin:0 0 10px"><button class="play sm ghost" id="lf">${IC.play} Listen first</button></div><p class="ask">Who are you? <span class="ar">من أنت؟ اختر الشخصية</span></p><div class="row">${DL.cast.map(c=>`<button class="play" style="background:${SPC[c]}" data-c="${c}">${AVC[c]?`<span style="display:inline-block;width:30px;height:30px;vertical-align:middle">${PIC[AVC[c]]}</span>`:''} ${c==='You'?'I am the customer':c==='Waiter'?'I am the waiter':'I am '+c}</button>`).join('')}</div>`;bindTabs();
  $$('[data-c]',st).forEach(b=>b.onclick=()=>role(b.dataset.c));$('#lf').onclick=async()=>{const nav=NAV;for(const l of DL.lines){if(nav!==NAV||!(await say(l.au)))break;await sleep(350/S.rate)}};return}
 if(mode==='gap')return gapPlay();
 afterIntro(()=>{});
 async function role(me){const L=DL.lines;let i=0,tot=0,cnt=0;const nav=NAV;
  st.innerHTML=head+`<div class="dl" id="dl"></div><div id="rz"></div>`;bindTabs();const dl=$('#dl'),rz=$('#rz');
  async function step(){if(nav!==NAV)return;$('.prog i').style.width=(100*i/L.length)+'%';if(i>=L.length){const pct=cnt?Math.round(tot/cnt):0;endScreen(g,mode,pct,`Your speaking score as ${me}.`);$('.end').insertAdjacentHTML('beforeend','<div id="rk"></div>');recWidget($('#rk'),`Dialogue: ${DL.title} (I am ${me})`,{hint:'Now read your part again and keep the recording.',hintAr:'اقرأ دورك مرة أخرى واحفظ التسجيل'});return}
   const l=L[i];dl.insertAdjacentHTML('beforeend',bubble(l,DL.cast,i,l.sp===me?'me now':'now'));$$('.bub',dl).forEach((b,k)=>b.classList.toggle('now',k===i));dl.lastElementChild.scrollIntoView({behavior:'smooth',block:'center'});
   if(l.sp!==me){rz.innerHTML='';let ok=await say(l.au);if(nav!==NAV)return;if(!ok){await sleep(200);ok=await say(l.au);if(nav!==NAV)return}i++;await sleep(450/S.rate);return step()}
   rz.innerHTML=`<p class="ask">Your turn! Say your line. <span class="ar">دورك! قل جملتك</span></p><div class="row"><button class="play sm ghost" id="hm">${IC.spk} Hear it first</button><button class="play sm ghost" id="sk">Skip ➜</button></div><div id="mz"></div>`;
   $('#hm').onclick=()=>say(l.au);$('#sk').onclick=()=>{cnt++;i++;step()};let tries=0;
   micWidget($('#mz'),{label:'Tap and say your line',maxMs:9000,onResult:res=>{if(res.self){res.h.insertAdjacentHTML('beforeend',`<div class="row"><button class="play sm teal" id="ok1">I said it ✓</button></div>`);$('#ok1').onclick=()=>{tot+=80;cnt++;i++;step()};return}
    const sc=scoreSpeech(l.t,res.heard);tries++;res.h.innerHTML=colorWords(sc)+`<div class="meter"><i style="width:${sc.pct}%;background:${sc.pct>=70?'#16A34A':sc.pct>=40?'#F59E0B':'#E11D48'}"></i></div><b>${sc.pct}%</b>`;
    if(sc.pct>=70){sfx.good();tot+=sc.pct;cnt++;feedback(true,praise()[0],`${sc.pct}% — clear speaking!`,'',{onNext:()=>{i++;step()},auto:1300})}
    else{sfx.bad();feedback(false,sc.pct>=40?'Almost! Say the red words again.':'Try again, slowly.','Tap the mic again, or Next.','اضغط الميكروفون مرة أخرى',{next:'Next',onNext:()=>{tot+=sc.pct;cnt++;i++;step()},alt:'🔊 Hear it',onAlt:()=>say(l.au)})}}})}
  step()}
 function gapPlay(){const L=DL.lines.filter(l=>l.key&&l.t.toLowerCase().includes(l.key.toLowerCase()));const keys=[...new Set(L.map(l=>l.key))];let i=0,score=0;
  function show(){hideFb();$('.prog i').style.width=(100*i/L.length)+'%';$('.score .ok').textContent=score;if(i>=L.length)return endScreen(g,'gap',Math.round(100*score/L.length));
   const l=L[i];const ix=l.t.toLowerCase().indexOf(l.key.toLowerCase());const gapped=esc(l.t.slice(0,ix))+'<span class="gap">?</span>'+esc(l.t.slice(ix+l.key.length));
   const opts=shuffle([l.key,...shuffle(keys.filter(k=>k.toLowerCase()!==l.key.toLowerCase())).slice(0,2)]);let first=true;
   st.innerHTML=head+`<p class="ask">Listen and choose the missing words.<span class="ar">استمع واختر الكلمات الناقصة</span></p>${pbtn()}<div class="dl">${bubble({...l,html:gapped},DL.cast,0,'now')}</div><div class="opts three">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;bindTabs();
   $('.pbtn',st).onclick=()=>say(l.au);
   $$('.opt',st).forEach(b=>b.onclick=()=>{if(b.disabled)return;const ok=b.dataset.o===l.key;$$('.opt',st).forEach(x=>{x.disabled=true;if(x.dataset.o===l.key)x.classList.add('good')});
    if(ok){if(first)score++;sfx.good();$('.gap',st).outerHTML=`<span class="key">${esc(l.key)}</span>`;feedback(true,praise()[0],esc(l.t),l.ar,{onNext:()=>{i++;show()},auto:1600})}
    else{first=false;b.classList.add('bad');sfx.bad();say(l.au);feedback(false,'Not quite',`The answer: <b>${esc(l.key)}</b>`,l.ar,{onNext:()=>{i++;show()},alt:'🔊 Hear it',onAlt:()=>say(l.au)})}});
   setTimeout(()=>say(l.au),250)}
  show()}}

name: Build lesson audio (Microsoft neural voices)
on:
  push:
    branches: [tts-build]
    paths: ['tts/gen3.py','.github/workflows/tts.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q edge-tts faster-whisper
      - run: cd tts && python gen3.py > gen.log 2>&1; tail -30 gen.log; cat verify.log | head -40 || true
      - if: always()
        run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          git add -A tts || true
          git commit -m "Generated lesson audio" || echo nothing
          git push

name: Build lesson audio (Microsoft neural voices)
on:
  push:
    branches: [tts-build]
    paths: ['tts/gen2.py','tts/clips.json','.github/workflows/tts.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q edge-tts
      - run: cd tts && python gen2.py us uk && ls mp3n | wc -l
      - run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          git add tts/mp3n
          git commit -m "Generated lesson audio" || echo nothing
          git push
